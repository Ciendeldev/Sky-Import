name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene
# sentido pagar por verificar un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, lint, pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Compilación de producción
        run: npm run build

      - name: Presupuesto de bundle
        run: npx size-limit

  e2e:
    name: Recorrido de compra y accesibilidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # El binario del navegador tiene que venir de la misma versión que la
      # librería del proyecto: por eso `npx playwright`, que resuelve al local.
      - run: npx playwright install --with-deps chromium

      # Las pruebas levantan la COMPILACIÓN DE PRODUCCIÓN en el puerto 3100, así
      # que hay que compilar aquí. El build del otro trabajo no sirve: cada
      # trabajo de GitHub corre en su propia máquina y arranca con el repositorio
      # recién clonado. Sin este paso, Playwright intenta `next start`, no
      # encuentra `.next` y el trabajo muere antes de la primera prueba.
      - name: Compilación de producción
        run: npm run build

      - name: Recorrido completo
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  seguridad:
    name: Secretos y dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
