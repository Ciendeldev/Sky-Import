<svg xmlns="http://www.w3.org/2000/svg" width="760" height="715" viewBox="0 0 760 715" font-family="Arial, sans-serif">
  <title>RF05 — Compra directa desde la ficha</title><desc>Quién compra una sola pieza sin pasar por el carrito, y qué prepara el sistema.</desc>
  <rect width="760" height="715" fill="#ffffff"/>
  <defs><marker id="f-llena" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#263847"/></marker><marker id="f-abierta" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#455c6e" stroke-width="1.2"/></marker></defs>
  <rect x="18" y="10" width="74" height="30" rx="5" fill="#14212e"/>
  <text x="55" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff"><tspan x="55" dy="0">RF05</tspan></text>
  <text x="106" y="31" text-anchor="start" font-size="22" font-weight="700" fill="#14212e"><tspan x="106" dy="0">Compra directa desde la ficha</tspan></text>
  <rect x="18" y="49" width="724" height="178" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="73" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">CASO DE USO · ACTOR Y FUNCIÓN</tspan></text><rect x="249" y="83" width="479" height="134" rx="4" fill="#ffffff" stroke="#bac8d3"/><text x="259" y="102" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="259" dy="0">Sky Import</tspan></text><line x1="148" y1="133" x2="265" y2="129" stroke="#455c6e" stroke-width="1.4"/><g stroke="#376b9d" stroke-width="2" fill="none"><circle cx="122" cy="108" r="10" fill="#edf4fb"/><path d="M122 118 v30 m-23,-18 h46 m-23,18 l-18,23 m18,-23 l18,23"/></g><text x="122" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#224c71"><tspan x="122" dy="0">Cliente</tspan></text><text x="122" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#455c6e"><tspan x="122" dy="0">sin cuenta ni registro</tspan></text><ellipse cx="488.5" cy="129" rx="223.5" ry="19" fill="#edf4fb" stroke="#376b9d" stroke-width="1.5"/><text x="488.5" y="134" text-anchor="middle" font-size="16" font-weight="400" fill="#224c71"><tspan x="488.5" dy="0">Comprar una pieza directo</tspan></text><rect x="18" y="239" width="724" height="308" rx="6" fill="#ffffff" stroke="#bac8d3"/><text x="32" y="263" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">SECUENCIA · COMPORTAMIENTO DEL SISTEMA</tspan></text><rect x="24" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="97" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="97" dy="0">Cliente</tspan></text><line x1="97" y1="322" x2="97" y2="535" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="212.66666666666663" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="285.66666666666663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="285.66666666666663" dy="0">Ficha de producto</tspan></text><line x1="285.66666666666663" y1="322" x2="285.66666666666663" y2="535" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="401.3333333333333" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="474.3333333333333" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="474.3333333333333" dy="0">Redactor</tspan></text><line x1="474.3333333333333" y1="322" x2="474.3333333333333" y2="535" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="590" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="663" dy="0">WhatsApp</tspan></text><line x1="663" y1="322" x2="663" y2="535" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="58.093333333333334" y="328" width="266.47999999999996" height="19" rx="2" fill="#ffffff"/><text x="191.33333333333331" y="342" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="191.33333333333331" dy="0">1. pulsa «Comprar por WhatsApp»</tspan></text><line x1="97" y1="355" x2="285.66666666666663" y2="355" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="239.80000000000007" y="368" width="280.39999999999986" height="19" rx="2" fill="#ffffff"/><text x="380" y="382" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="380" dy="0">2. nombre, código, cantidad y precio</tspan></text><line x1="285.66666666666663" y1="395" x2="474.3333333333333" y2="395" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="299.25333333333344" y="408" width="350.1599999999998" height="19" rx="2" fill="#ffffff"/><text x="474.3333333333333" y="422" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="474.3333333333333" dy="0">3. convierte a guaraníes con la tasa vigente</tspan></text><path d="M474.3333333333333 435 h-30 v12 h30" fill="none" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="260.20000000000005" y="452" width="239.5999999999999" height="19" rx="2" fill="#ffffff"/><text x="380" y="466" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="380" dy="0">4. mensaje redactado y enlace</tspan></text><line x1="474.3333333333333" y1="479" x2="285.66666666666663" y2="479" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="252.60000000000002" y="492" width="254.79999999999995" height="19" rx="2" fill="#ffffff"/><text x="380" y="506" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="380" dy="0">5. el propio cliente abre y envía</tspan></text><line x1="97" y1="519" x2="663" y2="519" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="18" y="559" width="724" height="94" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="583" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">COMPONENTES QUE INTERVIENEN</tspan></text><rect x="38" y="595" width="334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="603" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="621" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="205" y="623" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="205" dy="0">Ficha de producto</tspan></text><rect x="388" y="595" width="334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="383" y="603" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="383" y="621" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="555" y="623" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="555" dy="0">Redactor de mensajes</tspan></text>
  <text x="20" y="679" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="20" dy="0">Este camino no registra pedido: es una consulta por una pieza. El registro ocurre solo cuando se</tspan><tspan x="20" dy="18">cierra un pedido completo desde el checkout.</tspan></text>
  </svg>
