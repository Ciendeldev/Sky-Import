  <line x1="584" y1="226" x2="837" y2="226" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="715" y="218" text-anchor="middle" font-size="12" fill="#2f3a45">1. actual, nueva y repetición</text><line x1="846" y1="270" x2="1099" y2="270" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="977" y="262" text-anchor="middle" font-size="12" fill="#2f3a45">2. changeOwnPassword()</text><line x1="1108" y1="314" x2="1361" y2="314" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="1239" y="306" text-anchor="middle" font-size="12" fill="#2f3a45">3. comprueba la actual en una sesión aislada, sin cookies</text><line x1="1370" y1="358" x2="1117" y2="358" stroke="#5b6875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#f-abierta)"/><text x="1239" y="350" text-anchor="middle" font-size="12" fill="#5b6875">4. misma identidad confirmada</text><line x1="1108" y1="402" x2="1361" y2="402" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="1239" y="394" text-anchor="middle" font-size="12" fill="#2f3a45">5. actualiza la credencial</text><path d="M1108 436 h38 v22 h-38" fill="none" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="1154" y="438" text-anchor="start" font-size="12" fill="#2f3a45">6. cierra la sesión auxiliar de comprobación</text><line x1="1108" y1="500" x2="855" y2="500" stroke="#5b6875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#f-abierta)"/><text x="977" y="492" text-anchor="middle" font-size="12" fill="#5b6875">7. contraseña actualizada</text>
  

  <text x="30" y="578" font-size="12" fill="#7a8794">La comprobación usa un cliente aparte y sin cookies a propósito: verificar la contraseña vigente no debe reemplazar ni invalidar la sesión que el operador tiene abierta.</text>
