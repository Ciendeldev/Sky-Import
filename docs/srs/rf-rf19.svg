      <line x1="846" y1="192" x2="846" y2="522" stroke="#9dbad6" stroke-width="1.3" stroke-dasharray="6 5"/>
      <rect x="1024" y="152" width="168" height="40" rx="4" fill="#ffffff" stroke="#5b6875" stroke-width="1.6"/>
      <text x="1108" y="177" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f3a45">Servidor</text>
      <line x1="1108" y1="192" x2="1108" y2="522" stroke="#9dbad6" stroke-width="1.3" stroke-dasharray="6 5"/>
      <rect x="1286" y="152" width="168" height="40" rx="4" fill="#ffffff" stroke="#5b6875" stroke-width="1.6"/>
      <text x="1370" y="177" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f3a45">Autenticación</text>
