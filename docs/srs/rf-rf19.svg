  <text x="30" y="42" font-size="21" font-weight="700" fill="#12181f">RF19 · Cambio de la contraseña propia</text>
  <text x="30" y="68" font-size="13.5" fill="#5b6875">Quién cambia su clave y cómo se comprueba la actual sin cortarle la sesión.</text>
  <line x1="30" y1="84" x2="1430" y2="84" stroke="#c8d2dc" stroke-width="1.4"/>

  
