    <g stroke="#b5762f" stroke-width="2.2" fill="none">
      <circle cx="108" cy="170" r="17" fill="#fdf1e3"/>
      <line x1="108" y1="187" x2="108" y2="232"/>
      <line x1="80" y1="202" x2="136" y2="202"/>
      <line x1="108" y1="232" x2="86" y2="268"/>
