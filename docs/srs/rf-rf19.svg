  <text x="108" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4d12">Administrador</text>
  <text x="108" y="308" text-anchor="middle" font-size="11.5" fill="#5b6875">y también el moderador</text>
  
      <ellipse cx="368" cy="204" rx="118" ry="26" fill="#ffffff" stroke="#b5762f" stroke-width="1.8"/>
      <text x="368" y="209" text-anchor="middle" font-size="12.5" fill="#7a4d12">Cambiar mi contraseña</text>
      <line x1="138" y1="208" x2="248" y2="204" stroke="#5b6875" stroke-width="1.3"/>
  
  <rect x="524" y="108" width="906" height="438" rx="6" fill="#ffffff" stroke="#c8d2dc" stroke-width="1.4"/>
  <text x="540" y="134" font-size="12.5" font-weight="700" fill="#12181f" letter-spacing="1.2">COMPORTAMIENTO — CÓMO RESPONDE EL SISTEMA</text>
  
      <rect x="500" y="152" width="168" height="40" rx="4" fill="#ffffff" stroke="#5b6875" stroke-width="1.6"/>
      <text x="584" y="177" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f3a45">Operador</text>
      <line x1="584" y1="192" x2="584" y2="522" stroke="#9dbad6" stroke-width="1.3" stroke-dasharray="6 5"/>
      <rect x="762" y="152" width="168" height="40" rx="4" fill="#ffffff" stroke="#5b6875" stroke-width="1.6"/>
