110 L520 1110 L520 1135" stroke="#536775" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M185 550 L185 1174 L316 1174" stroke="#536775" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="320" y="1139" width="650" height="72" rx="9" fill="#eaf3ee" stroke="#536775" stroke-width="2"/><text x="645" y="1168.4" text-anchor="middle" font-size="22" fill="#243746"><tspan x="645" dy="0">El navegador prepara el enlace a WhatsApp.</tspan><tspan x="645" dy="28.6">El cliente lo abre y envía el mensaje.</tspan></text><text x="500" y="1242" text-anchor="middle" font-size="21" fill="#243746"><tspan x="500" dy="0">La aplicación no procesa ni confirma el pago de la operación.</tspan></text></svg>