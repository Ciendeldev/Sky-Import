" font-size="21" fill="#243746"><tspan x="185" dy="0">Prepara mensaje simple</tspan><tspan x="185" dy="27.3">Producto, SKU e importe</tspan><tspan x="185" dy="27.3">Sin registro de pedido</tspan></text><path d="M660 337 L940 337 L940 405 L645 405 L645 431" stroke="#536775" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="780" y="323" text-anchor="middle" font-size="21" fill="#243746"><tspan x="780" dy="0">No: carrito y checkout</tspan></text><rect x="390" y="435" width="510" height="115" rx="9" fill="#f4f7fa" stroke="#536775" stroke-width="2"/><text x="645" y="471.59999999999997" text-anchor="middle" font-size="22" fill="#243746"><tspan x="645" dy="0">Completa datos de entrega</tspan><tspan x="645" dy="28.6">Puede aplicar un cupón</tspan><tspan x="645" dy="28.6">Valida los datos antes de continuar</tspan></text><path d="M645 550 L645 579" stroke="#536775" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="390" y="583" width="510" height="100" rx="9" fill="#eef4fb" stroke="#536775" stroke-width="2"/><text x="645" y="612.1" text-anchor="middle" font-size="22" fill="#243746"><tspan x="645" dy="0">Solicita place_order()</tspan><tspan x="645" dy="28.6">Valida precios, cupón y existencias</tspan><tspan x="645" dy="28.6">Intenta guardar pedido y líneas</tspan></text><path d="M645 683 L645 710" stroke="#536775" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><polygon points="645,712 825,777 645,842 465,777" fill="#fff5e3" stroke="#9a723c" stroke-width="2"/><text x="645" y="769" text-anchor="middle" font-size="22" fill="#243746"><tspan x="645" dy="0">Resultado del</tspan><tspan x="645" dy="28.6">registro</tspan></text><path d="M465 777 L445 777 L445 921" stroke="#536775" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="370" y="861" width="122.00000000000001" height="27" fill="white"/><text x="431" y="881" text-anchor="middle" font-size="20" fill="#243746"><tspan x="431" dy="0">Registrado</tspan></text><path d="M645 84