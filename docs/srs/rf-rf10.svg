<svg xmlns="http://www.w3.org/2000/svg" width="760" height="799" viewBox="0 0 760 799" font-family="Arial, sans-serif">
  <title>RF10 — Registro del pedido</title><desc>Quién registra el pedido y qué hace la base para que dos clientes no se lleven la misma unidad.</desc>
  <rect width="760" height="799" fill="#ffffff"/>
  <defs><marker id="f-llena" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#263847"/></marker><marker id="f-abierta" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#455c6e" stroke-width="1.2"/></marker></defs>
  <rect x="18" y="10" width="74" height="30" rx="5" fill="#14212e"/>
  <text x="55" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff"><tspan x="55" dy="0">RF10</tspan></text>
  <text x="106" y="31" text-anchor="start" font-size="22" font-weight="700" fill="#14212e"><tspan x="106" dy="0">Registro del pedido</tspan></text>
  <rect x="18" y="49" width="724" height="178" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="73" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">CASO DE USO · ACTOR Y FUNCIÓN</tspan></text><rect x="249" y="83" width="479" height="134" rx="4" fill="#ffffff" stroke="#bac8d3"/><text x="259" y="102" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="259" dy="0">Sky Import</tspan></text><line x1="148" y1="133" x2="265" y2="129" stroke="#455c6e" stroke-width="1.4"/><g stroke="#376b9d" stroke-width="2" fill="none"><circle cx="122" cy="108" r="10" fill="#edf4fb"/><path d="M122 118 v30 m-23,-18 h46 m-23,18 l-18,23 m18,-23 l18,23"/></g><text x="122" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#224c71"><tspan x="122" dy="0">Cliente</tspan></text><text x="122" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#455c6e"><tspan x="122" dy="0">sin cuenta ni registro</tspan></text><ellipse cx="488.5" cy="129" rx="223.5" ry="19" fill="#edf4fb" stroke="#376b9d" stroke-width="1.5"/><text x="488.5" y="134" text-anchor="middle" font-size="16" font-weight="400" fill="#224c71"><tspan x="488.5" dy="0">Registrar el pedido</tspan></text><rect x="18" y="239" width="724" height="392" rx="6" fill="#ffffff" stroke="#bac8d3"/><text x="32" y="263" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">SECUENCIA · COMPORTAMIENTO DEL SISTEMA</tspan></text><rect x="24" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="97" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="97" dy="0">Cliente</tspan></text><line x1="97" y1="322" x2="97" y2="619" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="212.66666666666663" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="285.66666666666663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="285.66666666666663" dy="0">Checkout</tspan></text><line x1="285.66666666666663" y1="322" x2="285.66666666666663" y2="619" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="401.3333333333333" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="474.3333333333333" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="474.3333333333333" dy="0">Base de datos</tspan></text><line x1="474.3333333333333" y1="322" x2="474.3333333333333" y2="619" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="590" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="663" dy="0">orders</tspan></text><line x1="663" y1="322" x2="663" y2="619" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="60.413333333333355" y="328" width="261.8399999999999" height="19" rx="2" fill="#ffffff"/><text x="191.33333333333331" y="342" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="191.33333333333331" dy="0">1. confirma sus datos de entrega</tspan></text><line x1="97" y1="355" x2="285.66666666666663" y2="355" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="196.44000000000014" y="368" width="367.1199999999997" height="19" rx="2" fill="#ffffff"/><text x="380" y="382" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="380" dy="0">2. place_order(líneas, cliente, destino, cupón)</tspan></text><line x1="285.66666666666663" y1="395" x2="474.3333333333333" y2="395" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="320.5333333333334" y="408" width="307.59999999999985" height="19" rx="2" fill="#ffffff"/><text x="474.3333333333333" y="422" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="474.3333333333333" dy="0">3. relee el precio vigente de cada pieza</tspan></text><path d="M474.3333333333333 435 h-30 v12 h30" fill="none" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="303.4133333333334" y="452" width="341.8399999999998" height="19" rx="2" fill="#ffffff"/><text x="474.3333333333333" y="466" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="474.3333333333333" dy="0">4. bloquea las filas y comprueba existencias</tspan></text><path d="M474.3333333333333 479 h-30 v12 h30" fill="none" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="447.90666666666664" y="496" width="241.51999999999998" height="19" rx="2" fill="#ffffff"/><text x="568.6666666666666" y="510" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="568.6666666666666" dy="0">5. graba el pedido y sus líneas</tspan></text><line x1="474.3333333333333" y1="523" x2="663" y2="523" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="446.7066666666667" y="536" width="243.9199999999999" height="19" rx="2" fill="#ffffff"/><text x="568.6666666666666" y="550" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="568.6666666666666" dy="0">6. número correlativo asignado</tspan></text><line x1="663" y1="563" x2="474.3333333333333" y2="563" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="217.56000000000006" y="576" width="324.8799999999999" height="19" rx="2" fill="#ffffff"/><text x="380" y="590" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="380" dy="0">7. importes grabados, o la pieza que faltó</tspan></text><line x1="474.3333333333333" y1="603" x2="285.66666666666663" y2="603" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="18" y="643" width="724" height="94" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="667" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">COMPONENTES QUE INTERVIENEN</tspan></text><rect x="38" y="679" width="217.33333333333334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="687" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="705" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="146.66666666666669" y="707" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="146.66666666666669" dy="0">Checkout</tspan></text><rect x="271.33333333333337" y="679" width="217.33333333333334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="266.33333333333337" y="687" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="266.33333333333337" y="705" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="380.00000000000006" y="707" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="380.00000000000006" dy="0">Funciones transaccionales</tspan></text><rect x="504.6666666666667" y="679" width="217.33333333333334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="499.6666666666667" y="687" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="499.6666666666667" y="705" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="613.3333333333334" y="707" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="613.3333333333334" dy="0">Control de existencias</tspan></text>
  <text x="20" y="763" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="20" dy="0">La transacción relee precios y stock. Sin existencias no registra ni permite continuar. Un fallo</tspan><tspan x="20" dy="18">técnico puede llevar al cierre por WhatsApp sin registro interno (RF11 y RNF09).</tspan></text>
  </svg>
