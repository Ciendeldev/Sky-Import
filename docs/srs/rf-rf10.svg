      <text x="1191.3333333333333" y="646" text-anchor="middle" font-size="12.5" fill="#2f3a45">Control de existencias</text>

  <text x="30" y="716" font-size="12" fill="#7a8794">El cliente transmite identificadores y cantidades, nunca importes: los precios se releen del catálogo dentro de la transacción. Si una pieza no alcanza, no se graba nada.</text>
