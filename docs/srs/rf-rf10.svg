  <line x1="584" y1="226" x2="837" y2="226" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="715" y="218" text-anchor="middle" font-size="12" fill="#2f3a45">1. confirma sus datos de entrega</text><line x1="846" y1="270" x2="1099" y2="270" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="977" y="262" text-anchor="middle" font-size="12" fill="#2f3a45">2. place_order(líneas, cliente, destino, cupón)</text><path d="M1108 304 h38 v22 h-38" fill="none" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="1154" y="306" text-anchor="start" font-size="12" fill="#2f3a45">3. relee el precio vigente de cada pieza</text><path d="M1108 358 h38 v22 h-38" fill="none" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="1154" y="360" text-anchor="start" font-size="12" fill="#2f3a45">4. bloquea las filas y comprueba existencias</text><line x1="1108" y1="422" x2="1361" y2="422" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="1239" y="414" text-anchor="middle" font-size="12" fill="#2f3a45">5. graba el pedido y sus líneas</text><line x1="1370" y1="466" x2="1117" y2="466" stroke="#5b6875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#f-abierta)"/><text x="1239" y="458" text-anchor="middle" font-size="12" fill="#5b6875">6. número correlativo asignado</text><line x1="1108" y1="510" x2="855" y2="510" stroke="#5b6875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#f-abierta)"/><text x="977" y="502" text-anchor="middle" font-size="12" fill="#5b6875">7. número de pedido, o la pieza que faltó</text>
  
