<svg xmlns="http://www.w3.org/2000/svg" width="760" height="773" viewBox="0 0 760 773" font-family="Arial, sans-serif">
  <title>RF21 — Restablecimiento de la contraseña de otra cuenta</title><desc>Quién puede darle una clave nueva a otro, y sobre qué cuentas no puede hacerlo.</desc>
  <rect width="760" height="773" fill="#ffffff"/>
  <defs><marker id="f-llena" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#263847"/></marker><marker id="f-abierta" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#455c6e" stroke-width="1.2"/></marker></defs>
  <rect x="18" y="10" width="74" height="30" rx="5" fill="#14212e"/>
  <text x="55" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff"><tspan x="55" dy="0">RF21</tspan></text>
  <text x="106" y="31" text-anchor="start" font-size="22" font-weight="700" fill="#14212e"><tspan x="106" dy="0">Restablecimiento de la contraseña de otra cuenta</tspan></text>
  <rect x="18" y="49" width="724" height="178" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="73" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">CASO DE USO · ACTOR Y FUNCIÓN</tspan></text><rect x="249" y="83" width="479" height="134" rx="4" fill="#ffffff" stroke="#bac8d3"/><text x="259" y="102" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="259" dy="0">Sky Import</tspan></text><line x1="148" y1="133" x2="265" y2="129" stroke="#455c6e" stroke-width="1.4"/><g stroke="#34734f" stroke-width="2" fill="none"><circle cx="122" cy="108" r="10" fill="#edf6ef"/><path d="M122 118 v30 m-23,-18 h46 m-23,18 l-18,23 m18,-23 l18,23"/></g><text x="122" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#27543c"><tspan x="122" dy="0">Moderador</tspan></text><text x="122" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#455c6e"><tspan x="122" dy="0">titular · usuario «Cielo»</tspan></text><ellipse cx="488.5" cy="129" rx="223.5" ry="19" fill="#edf6ef" stroke="#34734f" stroke-width="1.5"/><text x="488.5" y="134" text-anchor="middle" font-size="16" font-weight="400" fill="#27543c"><tspan x="488.5" dy="0">Restablecer la clave de un administrador</tspan></text><rect x="18" y="239" width="724" height="348" rx="6" fill="#ffffff" stroke="#bac8d3"/><text x="32" y="263" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">SECUENCIA · COMPORTAMIENTO DEL SISTEMA</tspan></text><rect x="24" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="97" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="97" dy="0">Moderador</tspan></text><line x1="97" y1="322" x2="97" y2="575" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="212.66666666666663" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="285.66666666666663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="285.66666666666663" dy="0">Configuración</tspan></text><line x1="285.66666666666663" y1="322" x2="285.66666666666663" y2="575" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="401.3333333333333" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="474.3333333333333" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="474.3333333333333" dy="0">Servidor</tspan></text><line x1="474.3333333333333" y1="322" x2="474.3333333333333" y2="575" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="590" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="663" dy="0">Autenticación</tspan></text><line x1="663" y1="322" x2="663" y2="575" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="38" y="328" width="325.83999999999986" height="19" rx="2" fill="#ffffff"/><text x="200.91999999999993" y="342" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="200.91999999999993" dy="0">1. elige la cuenta y escribe la clave nueva</tspan></text><line x1="97" y1="355" x2="285.66666666666663" y2="355" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="278.84000000000003" y="368" width="202.31999999999994" height="19" rx="2" fill="#ffffff"/><text x="380" y="382" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="380" dy="0">2. resetPanelPassword()</tspan></text><line x1="285.66666666666663" y1="395" x2="474.3333333333333" y2="395" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="239.65333333333353" y="408" width="469.35999999999956" height="19" rx="2" fill="#ffffff"/><text x="474.3333333333333" y="422" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="474.3333333333333" dy="0">3. exige moderador; rechaza la propia y la de otro moderador</tspan></text><path d="M474.3333333333333 435 h-30 v12 h30" fill="none" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="454.8666666666667" y="452" width="227.5999999999999" height="19" rx="2" fill="#ffffff"/><text x="568.6666666666666" y="466" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="568.6666666666666" dy="0">4. asigna la nueva credencial</tspan></text><line x1="474.3333333333333" y1="479" x2="663" y2="479" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="479.4266666666666" y="492" width="178.47999999999996" height="19" rx="2" fill="#ffffff"/><text x="568.6666666666666" y="506" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="568.6666666666666" dy="0">5. credencial cambiada</tspan></text><line x1="663" y1="519" x2="474.3333333333333" y2="519" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="243.96000000000004" y="532" width="272.0799999999999" height="19" rx="2" fill="#ffffff"/><text x="380" y="546" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="380" dy="0">6. la clave anterior deja de servir</tspan></text><line x1="474.3333333333333" y1="559" x2="285.66666666666663" y2="559" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="18" y="599" width="724" height="94" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="623" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">COMPONENTES QUE INTERVIENEN</tspan></text><rect x="38" y="635" width="334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="643" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="661" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="205" y="663" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="205" dy="0">Gestión de cuentas</tspan></text><rect x="388" y="635" width="334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="383" y="643" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="383" y="661" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="555" y="663" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="555" dy="0">Autenticación</tspan></text>
  <text x="20" y="719" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="20" dy="0">No se exige la contraseña vigente, porque el moderador no la conoce ni debe conocerla. Por eso mismo</tspan><tspan x="20" dy="18">la operación queda acotada a cuentas de perfil administrador: nadie se apodera de una cuenta de</tspan><tspan x="20" dy="18">igual jerarquía.</tspan></text>
  </svg>
