<svg xmlns="http://www.w3.org/2000/svg" width="760" height="747" viewBox="0 0 760 747" font-family="Arial, sans-serif">
  <title>RF01 — Autenticación del administrador</title><desc>Quién entra al panel y qué comprueba el sistema antes de dejarlo pasar. No lleva vista de componentes: la función no se explica mejor con ellos.</desc>
  <rect width="760" height="747" fill="#ffffff"/>
  <defs><marker id="f-llena" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#263847"/></marker><marker id="f-abierta" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#455c6e" stroke-width="1.2"/></marker></defs>
  <rect x="18" y="10" width="74" height="30" rx="5" fill="#14212e"/>
  <text x="55" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff"><tspan x="55" dy="0">RF01</tspan></text>
  <text x="106" y="31" text-anchor="start" font-size="22" font-weight="700" fill="#14212e"><tspan x="106" dy="0">Autenticación del administrador</tspan></text>
  <rect x="18" y="49" width="724" height="178" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="73" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">CASO DE USO · ACTOR Y FUNCIÓN</tspan></text><rect x="249" y="83" width="479" height="134" rx="4" fill="#ffffff" stroke="#bac8d3"/><text x="259" y="102" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="259" dy="0">Sky Import</tspan></text><line x1="148" y1="133" x2="265" y2="129" stroke="#455c6e" stroke-width="1.4"/><g stroke="#956124" stroke-width="2" fill="none"><circle cx="122" cy="108" r="10" fill="#faf1e6"/><path d="M122 118 v30 m-23,-18 h46 m-23,18 l-18,23 m18,-23 l18,23"/></g><text x="122" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#704716"><tspan x="122" dy="0">Administrador</tspan></text><text x="122" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#455c6e"><tspan x="122" dy="0">y también el moderador</tspan></text><ellipse cx="488.5" cy="129" rx="223.5" ry="19" fill="#faf1e6" stroke="#956124" stroke-width="1.5"/><text x="488.5" y="134" text-anchor="middle" font-size="16" font-weight="400" fill="#704716"><tspan x="488.5" dy="0">Iniciar sesión en el panel</tspan></text><rect x="18" y="239" width="724" height="428" rx="6" fill="#ffffff" stroke="#bac8d3"/><text x="32" y="263" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">SECUENCIA · COMPORTAMIENTO DEL SISTEMA</tspan></text><rect x="30.75" y="278" width="132.5" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="97" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="97" dy="0">Operador</tspan></text><line x1="97" y1="322" x2="97" y2="655" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="172.25" y="278" width="132.5" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="238.5" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="238.5" dy="0">Pantalla de</tspan><tspan x="238.5" dy="18">acceso</tspan></text><line x1="238.5" y1="322" x2="238.5" y2="655" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="313.75" y="278" width="132.5" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="380" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="380" dy="0">Servidor</tspan></text><line x1="380" y1="322" x2="380" y2="655" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="455.25" y="278" width="132.5" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="521.5" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="521.5" dy="0">Autenticación</tspan></text><line x1="521.5" y1="322" x2="521.5" y2="655" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="596.75" y="278" width="132.5" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="663" dy="0">admin_users</tspan></text><line x1="663" y1="322" x2="663" y2="655" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="41.31000000000003" y="328" width="252.87999999999994" height="19" rx="2" fill="#ffffff"/><text x="167.75" y="342" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="167.75" dy="0">1. escribe usuario y contraseña</tspan></text><line x1="97" y1="355" x2="238.5" y2="355" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="140.65000000000015" y="368" width="337.1999999999997" height="19" rx="2" fill="#ffffff"/><text x="309.25" y="382" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="309.25" dy="0">2. signIn(usuario, contraseña) por HTTPS</tspan></text><line x1="238.5" y1="395" x2="380" y2="395" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="217.88000000000008" y="408" width="324.23999999999984" height="19" rx="2" fill="#ffffff"/><text x="380" y="422" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="380" dy="0">3. traduce el usuario a su correo interno</tspan></text><path d="M380 435 h-30 v12 h30" fill="none" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="350.39000000000004" y="452" width="200.7199999999999" height="19" rx="2" fill="#ffffff"/><text x="450.75" y="466" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="450.75" dy="0">4. verifica la contraseña</tspan></text><line x1="380" y1="479" x2="521.5" y2="479" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="316.71000000000004" y="492" width="268.0799999999999" height="19" rx="2" fill="#ffffff"/><text x="450.75" y="506" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="450.75" dy="0">5. sesión válida y rol del metadato</tspan></text><line x1="521.5" y1="519" x2="380" y2="519" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="368.18000000000006" y="532" width="306.6399999999999" height="19" rx="2" fill="#ffffff"/><text x="521.5" y="546" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="521.5" dy="0">6. ¿pertenece al panel y sigue vigente?</tspan></text><line x1="380" y1="559" x2="663" y2="559" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="432.1" y="572" width="178.79999999999995" height="19" rx="2" fill="#ffffff"/><text x="521.5" y="586" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="521.5" dy="0">7. fila con revoked_at</tspan></text><line x1="663" y1="599" x2="380" y2="599" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="181.85000000000005" y="612" width="254.7999999999999" height="19" rx="2" fill="#ffffff"/><text x="309.25" y="626" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="309.25" dy="0">8. entra, o el motivo del rechazo</tspan></text><line x1="380" y1="639" x2="238.5" y2="639" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/>
  <text x="20" y="693" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="20" dy="0">Las credenciales pasan por el servidor mediante HTTPS para validarse en Supabase Auth. La</tspan><tspan x="20" dy="18">aplicación no consulta el hash ni guarda la contraseña en sus tablas. Exige una cuenta vigente en</tspan><tspan x="20" dy="18">admin_users.</tspan></text>
  </svg>
