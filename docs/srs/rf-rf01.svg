  <line x1="584" y1="226" x2="771.5" y2="226" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="682.25" y="218" text-anchor="middle" font-size="12" fill="#2f3a45">1. escribe usuario y contraseña</text><line x1="780.5" y1="270" x2="968" y2="270" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="878.75" y="262" text-anchor="middle" font-size="12" fill="#2f3a45">2. signIn(usuario, contraseña)</text><path d="M977 304 h38 v22 h-38" fill="none" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="1023" y="306" text-anchor="start" font-size="12" fill="#2f3a45">3. traduce el usuario a su correo interno</text><line x1="977" y1="368" x2="1164.5" y2="368" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="1075.25" y="360" text-anchor="middle" font-size="12" fill="#2f3a45">4. verifica la contraseña</text><line x1="1173.5" y1="412" x2="986" y2="412" stroke="#5b6875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#f-abierta)"/><text x="1075.25" y="404" text-anchor="middle" font-size="12" fill="#5b6875">5. sesión válida y rol del metadato</text><line x1="977" y1="456" x2="1361" y2="456" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="1173.5" y="448" text-anchor="middle" font-size="12" fill="#2f3a45">6. ¿pertenece al panel y sigue vigente?</text><line x1="1370" y1="500" x2="986" y2="500" stroke="#5b6875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#f-abierta)"/><text x="1173.5" y="492" text-anchor="middle" font-size="12" fill="#5b6875">7. fila con revoked_at</text><line x1="977" y1="544" x2="789.5" y2="544" stroke="#5b6875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#f-abierta)"/><text x="878.75" y="536" text-anchor="middle" font-size="12" fill="#5b6875">8. entra, o el motivo del rechazo</text>
  

  <text x="30" y="622" font-size="12" fill="#7a8794">La contraseña nunca llega al servidor de la tienda: viaja al servicio de autenticación y vuelve una sesión. Un acceso retirado se rechaza acá aunque la contraseña siga siendo correcta.</text>
