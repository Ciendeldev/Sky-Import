  <text x="30" y="42" font-size="21" font-weight="700" fill="#12181f">RF01 · Autenticación del administrador</text>
  <text x="30" y="68" font-size="13.5" fill="#5b6875">Quién entra al panel y qué comprueba el sistema antes de dejarlo pasar. No lleva vista de componentes: la función no se explica mejor con ellos.</text>
  <line x1="30" y1="84" x2="1430" y2="84" stroke="#c8d2dc" stroke-width="1.4"/>

  
