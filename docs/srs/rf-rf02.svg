      <rect x="963.6666666666666" y="676" width="10" height="8" fill="#ffffff" stroke="#5b6875" stroke-width="1.2"/>
      <text x="1191.3333333333333" y="680" text-anchor="middle" font-size="12.5" fill="#2f3a45">Conversión de moneda</text>

  <text x="30" y="750" font-size="12" fill="#7a8794">Las páginas del catálogo se generan de antemano, así que la primera consulta no espera a la base. El filtrado ocurre en el navegador y queda escrito en la dirección, de modo que un filtro se puede compartir por enlace.</text>
