  <line x1="584" y1="226" x2="837" y2="226" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="715" y="218" text-anchor="middle" font-size="12" fill="#2f3a45">1. abre el catálogo</text><line x1="846" y1="270" x2="1099" y2="270" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="977" y="262" text-anchor="middle" font-size="12" fill="#2f3a45">2. pide la página</text><line x1="1108" y1="314" x2="1361" y2="314" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="1239" y="306" text-anchor="middle" font-size="12" fill="#2f3a45">3. lee las piezas activas</text><line x1="1370" y1="358" x2="1117" y2="358" stroke="#5b6875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#f-abierta)"/><text x="1239" y="350" text-anchor="middle" font-size="12" fill="#5b6875">4. fichas, precios y existencias</text><line x1="1108" y1="402" x2="855" y2="402" stroke="#5b6875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#f-abierta)"/><text x="977" y="394" text-anchor="middle" font-size="12" fill="#5b6875">5. página ya generada</text><line x1="584" y1="446" x2="837" y2="446" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="715" y="438" text-anchor="middle" font-size="12" fill="#2f3a45">6. aplica filtros</text><path d="M846 480 h38 v22 h-38" fill="none" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="892" y="482" text-anchor="start" font-size="12" fill="#2f3a45">7. filtra en el navegador y escribe la URL</text><line x1="846" y1="544" x2="593" y2="544" stroke="#5b6875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#f-abierta)"/><text x="715" y="536" text-anchor="middle" font-size="12" fill="#5b6875">8. resultados, sin recargar la página</text>
  
