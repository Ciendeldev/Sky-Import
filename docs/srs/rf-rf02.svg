  <text x="30" y="42" font-size="21" font-weight="700" fill="#12181f">RF02 · Consulta y filtrado del catálogo</text>
  <text x="30" y="68" font-size="13.5" fill="#5b6875">Quién ve el catálogo, cómo se comporta el sistema cuando lo filtran y de qué partes se sirve.</text>
  <line x1="30" y1="84" x2="1430" y2="84" stroke="#c8d2dc" stroke-width="1.4"/>

  
