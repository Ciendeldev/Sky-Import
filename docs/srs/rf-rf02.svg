<svg xmlns="http://www.w3.org/2000/svg" width="760" height="853" viewBox="0 0 760 853" font-family="Arial, sans-serif">
  <title>RF02 — Consulta y filtrado del catálogo</title><desc>Quién ve el catálogo, cómo se comporta el sistema cuando lo filtran y de qué partes se sirve.</desc>
  <rect width="760" height="853" fill="#ffffff"/>
  <defs><marker id="f-llena" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#263847"/></marker><marker id="f-abierta" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#455c6e" stroke-width="1.2"/></marker></defs>
  <rect x="18" y="10" width="74" height="30" rx="5" fill="#14212e"/>
  <text x="55" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff"><tspan x="55" dy="0">RF02</tspan></text>
  <text x="106" y="31" text-anchor="start" font-size="22" font-weight="700" fill="#14212e"><tspan x="106" dy="0">Consulta y filtrado del catálogo</tspan></text>
  <rect x="18" y="49" width="724" height="178" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="73" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">CASO DE USO · ACTOR Y FUNCIÓN</tspan></text><rect x="249" y="83" width="479" height="134" rx="4" fill="#ffffff" stroke="#bac8d3"/><text x="259" y="102" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="259" dy="0">Sky Import</tspan></text><line x1="148" y1="133" x2="265" y2="129" stroke="#455c6e" stroke-width="1.4"/><line x1="148" y1="133" x2="265" y2="174" stroke="#455c6e" stroke-width="1.4"/><g stroke="#376b9d" stroke-width="2" fill="none"><circle cx="122" cy="108" r="10" fill="#edf4fb"/><path d="M122 118 v30 m-23,-18 h46 m-23,18 l-18,23 m18,-23 l18,23"/></g><text x="122" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#224c71"><tspan x="122" dy="0">Cliente</tspan></text><text x="122" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#455c6e"><tspan x="122" dy="0">sin cuenta ni registro</tspan></text><ellipse cx="488.5" cy="129" rx="223.5" ry="19" fill="#edf4fb" stroke="#376b9d" stroke-width="1.5"/><text x="488.5" y="134" text-anchor="middle" font-size="16" font-weight="400" fill="#224c71"><tspan x="488.5" dy="0">Consultar el catálogo</tspan></text><ellipse cx="488.5" cy="174" rx="223.5" ry="19" fill="#edf4fb" stroke="#376b9d" stroke-width="1.5"/><text x="488.5" y="179" text-anchor="middle" font-size="16" font-weight="400" fill="#224c71"><tspan x="488.5" dy="0">Filtrar por marca y precio</tspan></text><rect x="18" y="239" width="724" height="428" rx="6" fill="#ffffff" stroke="#bac8d3"/><text x="32" y="263" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">SECUENCIA · COMPORTAMIENTO DEL SISTEMA</tspan></text><rect x="24" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="97" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="97" dy="0">Cliente</tspan></text><line x1="97" y1="322" x2="97" y2="655" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="212.66666666666663" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="285.66666666666663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="285.66666666666663" dy="0">Vitrina</tspan></text><line x1="285.66666666666663" y1="322" x2="285.66666666666663" y2="655" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="401.3333333333333" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="474.3333333333333" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="474.3333333333333" dy="0">Servidor</tspan></text><line x1="474.3333333333333" y1="322" x2="474.3333333333333" y2="655" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="590" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="663" dy="0">products</tspan></text><line x1="663" y1="322" x2="663" y2="655" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="114.89333333333332" y="328" width="152.88" height="19" rx="2" fill="#ffffff"/><text x="191.33333333333331" y="342" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="191.33333333333331" dy="0">1. abre el catálogo</tspan></text><line x1="97" y1="355" x2="285.66666666666663" y2="355" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="314.2" y="368" width="131.60000000000002" height="19" rx="2" fill="#ffffff"/><text x="380" y="382" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="380" dy="0">2. pide la página</tspan></text><line x1="285.66666666666663" y1="395" x2="474.3333333333333" y2="395" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="472.14666666666665" y="408" width="193.0399999999999" height="19" rx="2" fill="#ffffff"/><text x="568.6666666666666" y="422" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="568.6666666666666" dy="0">3. lee las piezas activas</tspan></text><line x1="474.3333333333333" y1="435" x2="663" y2="435" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="443.90666666666664" y="448" width="249.51999999999992" height="19" rx="2" fill="#ffffff"/><text x="568.6666666666666" y="462" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="568.6666666666666" dy="0">4. fichas, precios y existencias</tspan></text><line x1="663" y1="475" x2="474.3333333333333" y2="475" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="292.92" y="488" width="174.15999999999997" height="19" rx="2" fill="#ffffff"/><text x="380" y="502" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="380" dy="0">5. página ya generada</tspan></text><line x1="474.3333333333333" y1="515" x2="285.66666666666663" y2="515" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="125.69333333333331" y="528" width="131.28" height="19" rx="2" fill="#ffffff"/><text x="191.33333333333331" y="542" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="191.33333333333331" dy="0">6. aplica filtros</tspan></text><line x1="97" y1="555" x2="285.66666666666663" y2="555" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="122.42666666666676" y="568" width="326.47999999999973" height="19" rx="2" fill="#ffffff"/><text x="285.66666666666663" y="582" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="285.66666666666663" dy="0">7. filtra en el navegador y escribe la URL</tspan></text><path d="M285.66666666666663 595 h30 v12 h-30" fill="none" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="46.81333333333336" y="612" width="289.0399999999999" height="19" rx="2" fill="#ffffff"/><text x="191.33333333333331" y="626" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="191.33333333333331" dy="0">8. resultados, sin recargar la página</tspan></text><line x1="285.66666666666663" y1="639" x2="97" y2="639" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="18" y="679" width="724" height="94" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="703" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">COMPONENTES QUE INTERVIENEN</tspan></text><rect x="38" y="715" width="217.33333333333334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="723" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="741" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="146.66666666666669" y="743" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="146.66666666666669" dy="0">Catálogo</tspan></text><rect x="271.33333333333337" y="715" width="217.33333333333334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="266.33333333333337" y="723" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="266.33333333333337" y="741" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="380.00000000000006" y="743" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="380.00000000000006" dy="0">Filtros y búsqueda</tspan></text><rect x="504.6666666666667" y="715" width="217.33333333333334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="499.6666666666667" y="723" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="499.6666666666667" y="741" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="613.3333333333334" y="743" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="613.3333333333334" dy="0">Conversión de moneda</tspan></text>
  <text x="20" y="799" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="20" dy="0">Las páginas del catálogo se generan de antemano, así que la primera consulta no espera a la base. El</tspan><tspan x="20" dy="18">filtrado ocurre en el navegador y queda escrito en la dirección, de modo que un filtro se puede</tspan><tspan x="20" dy="18">compartir por enlace.</tspan></text>
  </svg>
