  <text x="108" y="308" text-anchor="middle" font-size="11.5" fill="#5b6875">sin cuenta ni registro</text>
  
      <ellipse cx="368" cy="204" rx="118" ry="26" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.8"/>
