/><rect x="106.91999999999996" y="653" width="786.1600000000001" height="28" fill="white"/><text x="500" y="674" text-anchor="middle" font-size="21" fill="#243746"><tspan x="500" dy="0">El navegador compone el mensaje comercial antes de abrir WhatsApp.</tspan></text><rect x="103.79999999999998" y="718" width="312.40000000000003" height="27" fill="white"/><text x="260" y="738" text-anchor="middle" font-size="20" fill="#243746"><tspan x="260" dy="0">Enlace con texto codificado</tspan></text><rect x="645.4" y="718" width="189.20000000000002" height="27" fill="white"/><text x="740" y="738" text-anchor="middle" font-size="20" fill="#243746"><tspan x="740" dy="0">APIs sobre HTTPS</tspan></text><rect x="40" y="800" width="440" height="165" rx="9" fill="#eaf3ee" stroke="#536775" stroke-width="2"/><text x="260" y="847.3000000000001" text-anchor="middle" font-size="22" fill="#243746"><tspan x="260" dy="0">WhatsApp</tspan><tspan x="260" dy="28.6">Servicio externo de mensajería</tspan><tspan x="260" dy="28.6">El cliente envía el mensaje.</tspan><tspan x="260" dy="28.6">El vendedor acuerda venta y pago.</tspan></text><rect x="520" y="800" width="440" height="165" rx="9" fill="#eef4fb" stroke="#536775" stroke-width="2"/><text x="740" y="847.3000000000001" text-anchor="middle" font-size="22" fill="#243746"><tspan x="740" dy="0">Supabase</tspan><tspan x="740" dy="28.6">PostgreSQL y nueve tablas públicas</tspan><tspan x="740" dy="28.6">Auth, RLS y funciones SQL</tspan><tspan x="740" dy="28.6">Registro transaccional de pedidos</tspan></text><text x="500" y="1008" text-anchor="middle" font-size="21" fill="#243746"><tspan x="500" dy="0">El sistema no procesa pagos ni confirma el envío efectivo del mensaje.</tspan></text></svg>