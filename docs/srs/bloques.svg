<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" font-family="Arial, sans-serif"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#536775"/></marker></defs><text x="500" y="36" text-anchor="middle" font-size="28" fill="#111111" font-weight="700"><tspan x="500" dy="0">Bloques del sistema Sky Import</tspan></text><text x="500" y="70" text-anchor="middle" font-size="20" fill="#243746"><tspan x="500" dy="0">Funciones, usuarios y servicios externos</tspan></text><rect x="35" y="110" width="290" height="110" rx="9" fill="#eef4fb" stroke="#536775" stroke-width="2"/><text x="180" y="158.39999999999998" text-anchor="middle" font-size="22" fill="#243746" font-weight="700"><tspan x="180" dy="0">Cliente</tspan><tspan x="180" dy="28.6">Visita sin cuenta</tspan></text><rect x="355" y="110" width="290" height="110" rx="9" fill="#fdf1e3" stroke="#536775" stroke-width="2"/><text x="500" y="158.39999999999998" text-anchor="middle" font-size="22" fill="#243746" font-weight="700"><tspan x="500" dy="0">Administrador</tspan><tspan x="500" dy="28.6">Operación de la tienda</tspan></text><rect x="675" y="110" width="290" height="110" rx="9" fill="#eaf3ee" stroke="#536775" stroke-width="2"/><text x="820" y="158.39999999999998" text-anchor="middle" font-size="22" fill="#243746" font-weight="700"><tspan x="820" dy="0">Moderador</tspan><tspan x="820" dy="28.6">Administración y cuentas</tspan></text><path d="M180 220 L180 286" stroke="#536775" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M500 220 L500 286" stroke="#536775" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M820 220 L820 255 L530 255 L530 286" stroke="#536775" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="20" y="290" width="960" height="412" rx="10" fill="#fafbfc" stroke="#243746" stroke-width="2.5" stroke-dash