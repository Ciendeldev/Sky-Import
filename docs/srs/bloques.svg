<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1500" height="1000" fill="#ffffff"/>

  <text x="750" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#12181f">
    Diagrama de bloques — Sky Import
  </text>
  <text x="750" y="76" text-anchor="middle" font-size="16" fill="#5b6875">
    Fronteras del sistema e interacción con entidades externas
  </text>

  <!-- ══ ACTORES ══ -->
  <text x="130" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6875" letter-spacing="2">ACTORES</text>

  <g>
    <rect x="40" y="150" width="180" height="86" rx="6" fill="#eef4fb" stroke="#3a6ea5" stroke-width="2"/>
    <text x="130" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3a5c">Cliente</text>
    <text x="130" y="204" text-anchor="middle" font-size="13" fill="#40546b">Visitante público</text>
    <text x="130" y="222" text-anchor="middle" font-size="13" fill="#40546b">Navegador web</text>
  </g>

  <g>
    <rect x="40" y="300" width="180" height="86" rx="6" fill="#fdf1e3" stroke="#b5762f" stroke-width="2"/>
    <text x="130" y="332" text-anchor="middle" font-size="16" font-weight="700" fill="#7a4d12">Administrador</text>
    <text x="130" y="354" text-anchor="middle" font-size="13" fill="#5e4520">Usuario «Cielo»</text>
    <text x="130" y="372" text-anchor="middle" font-size="13" fill="#5e4520">Sesión autenticada</text>
  </g>

  <!-- ══ SISTEMA ══ -->
  <rect x="290" y="112" width="700" height="700" rx="10" fill="#f7f9fb" stroke="#12181f" stroke-width="2.5" stroke-dasharray="9 5"/>
  <text x="640" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#12181f" letter-spacing="2">
    SISTEMA SKY IMPORT (Next.js · App Router)
  </text>

  <!-- Capa pública -->
  <rect x="315" y="160" width="650" height="250" rx="7" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.6"/>
  <text x="335" y="186" font-size="14" font-weight="700" fill="#1d3a5c">Capa pública — tienda</text>

  <g font-size="13" fill="#22303f">
    <rect x="335" y="200" width="192" height="58" rx="5" fill="#eef4fb" stroke="#9dbad6"/>
    <text x="431" y="223" text-anchor="middle" font-weight="600">Catálogo</text>
    <text x="431" y="243" text-anchor="middle" font-size="12">Filtros · búsqueda</text>

    <rect x="543" y="200" width="192" height="58" rx="5" fill="#eef4fb" stroke="#9dbad6"/>
    <text x="639" y="223" text-anchor="middle" font-weight="600">Ficha de producto</text>
    <text x="639" y="243" text-anchor="middle" font-size="12">Variantes · SKU · stock</text>

    <rect x="751" y="200" width="192" height="58" rx="5" fill="#eef4fb" stroke="#9dbad6"/>
    <text x="847" y="223" text-anchor="middle" font-weight="600">Configurador</text>
    <text x="847" y="243" text-anchor="middle" font-size="12">Compatibilidad</text>

    <rect x="335" y="272" width="192" height="58" rx="5" fill="#eef4fb" stroke="#9dbad6"/>
    <text x="431" y="295" text-anchor="middle" font-weight="600">Carrito</text>
    <text x="431" y="315" text-anchor="middle" font-size="12">localStorage</text>

    <rect x="543" y="272" width="192" height="58" rx="5" fill="#eef4fb" stroke="#9dbad6"/>
    <text x="639" y="295" text-anchor="middle" font-weight="600">Checkout</text>
    <text x="639" y="315" text-anchor="middle" font-size="12">Datos · zona · cupón</text>

    <rect x="751" y="272" width="192" height="58" rx="5" fill="#eef4fb" stroke="#9dbad6"/>
    <text x="847" y="295" text-anchor="middle" font-weight="600">Multimoneda</text>
    <text x="847" y="315" text-anchor="middle" font-size="12">USD · PYG · BRL</text>

    <rect x="335" y="344" width="608" height="50" rx="5" fill="#e7f0f8" stroke="#9dbad6"/>
    <text x="639" y="367" text-anchor="middle" font-weight="600">Generador de mensajes de WhatsApp</text>
    <text x="639" y="385" text-anchor="middle" font-size="12">Formato 1 · compra directa    |    Formato 2 · pedido completo</text>
  </g>

  <!-- Capa administrativa -->
  <rect x="315" y="430" width="650" height="200" rx="7" fill="#ffffff" stroke="#b5762f" stroke-width="1.6"/>
  <text x="335" y="456" font-size="14" font-weight="700" fill="#7a4d12">Capa administrativa — panel /admin</text>

  <g font-size="13" fill="#22303f">
    <rect x="335" y="470" width="146" height="54" rx="5" fill="#fdf1e3" stroke="#d8ab6d"/>
    <text x="408" y="492" text-anchor="middle" font-weight="600">Inventario</text>
    <text x="408" y="511" text-anchor="middle" font-size="12">Productos · variantes</text>

    <rect x="493" y="470" width="146" height="54" rx="5" fill="#fdf1e3" stroke="#d8ab6d"/>
    <text x="566" y="492" text-anchor="middle" font-weight="600">Precios</text>
    <text x="566" y="511" text-anchor="middle" font-size="12">Tasa de cambio</text>

    <rect x="651" y="470" width="146" height="54" rx="5" fill="#fdf1e3" stroke="#d8ab6d"/>
    <text x="724" y="492" text-anchor="middle" font-weight="600">Cupones</text>
    <text x="724" y="511" text-anchor="middle" font-size="12">% o monto fijo</text>

    <rect x="809" y="470" width="134" height="54" rx="5" fill="#fdf1e3" stroke="#d8ab6d"/>
    <text x="876" y="492" text-anchor="middle" font-weight="600">Pedidos</text>
    <text x="876" y="511" text-anchor="middle" font-size="12">Seguimiento</text>

    <rect x="335" y="538" width="608" height="52" rx="5" fill="#fbe9d3" stroke="#d8ab6d"/>
    <text x="639" y="560" text-anchor="middle" font-weight="600">Control de acceso por rol</text>
    <text x="639" y="579" text-anchor="middle" font-size="12">Guard de rutas + tabla admin_users + políticas RLS</text>
  </g>

  <!-- Capa de datos -->
  <rect x="315" y="650" width="650" height="140" rx="7" fill="#ffffff" stroke="#2f7d5f" stroke-width="1.6"/>
  <text x="335" y="676" font-size="14" font-weight="700" fill="#1d5340">Capa de acceso a datos</text>
  <g font-size="13" fill="#22303f">
    <rect x="335" y="690" width="296" height="82" rx="5" fill="#e8f4ee" stroke="#8fc4ad"/>
    <text x="483" y="713" text-anchor="middle" font-weight="600">Cliente anónimo</text>
    <text x="483" y="733" text-anchor="middle" font-size="12">Lectura pública sujeta a RLS</text>
    <text x="483" y="752" text-anchor="middle" font-size="12">Funciones validate_coupon / place_order</text>

    <rect x="647" y="690" width="296" height="82" rx="5" fill="#e8f4ee" stroke="#8fc4ad"/>
    <text x="795" y="713" text-anchor="middle" font-weight="600">Cliente con sesión</text>
    <text x="795" y="733" text-anchor="middle" font-size="12">Escritura del panel</text>
    <text x="795" y="752" text-anchor="middle" font-size="12">Verificada por política RLS</text>
  </g>

  <!-- ══ EXTERNOS ══ -->
  <text x="1250" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6875" letter-spacing="2">ENTIDADES EXTERNAS</text>

  <g>
    <rect x="1060" y="150" width="380" height="150" rx="6" fill="#e8f4ee" stroke="#2f7d5f" stroke-width="2"/>
    <text x="1250" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#1d5340">Supabase</text>
    <text x="1250" y="203" text-anchor="middle" font-size="13" fill="#2c4f42">PostgreSQL 15 · puerto 5432</text>
    <text x="1250" y="226" text-anchor="middle" font-size="13" fill="#2c4f42">8 tablas · RLS en todas</text>
    <text x="1250" y="249" text-anchor="middle" font-size="13" fill="#2c4f42">Supabase Auth (hash de claves)</text>
    <text x="1250" y="272" text-anchor="middle" font-size="13" fill="#2c4f42">Funciones SECURITY DEFINER</text>
  </g>

  <g>
    <rect x="1060" y="340" width="380" height="120" rx="6" fill="#e6f6ec" stroke="#1f8a4c" stroke-width="2"/>
    <text x="1250" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#12603a">WhatsApp</text>
    <text x="1250" y="393" text-anchor="middle" font-size="13" fill="#25543c">API de enlace wa.me</text>
    <text x="1250" y="416" text-anchor="middle" font-size="13" fill="#25543c">+595 994 222 542</text>
    <text x="1250" y="439" text-anchor="middle" font-size="13" fill="#25543c">Único canal de cierre de venta</text>
  </g>

  <g>
    <rect x="1060" y="500" width="380" height="106" rx="6" fill="#f2f0fa" stroke="#5b4b9e" stroke-width="2"/>
    <text x="1250" y="530" text-anchor="middle" font-size="17" font-weight="700" fill="#3a2f6b">Vercel</text>
    <text x="1250" y="553" text-anchor="middle" font-size="13" fill="#463a7d">Alojamiento y CDN</text>
    <text x="1250" y="576" text-anchor="middle" font-size="13" fill="#463a7d">HTTPS · puerto 443</text>
    <text x="1250" y="596" text-anchor="middle" font-size="13" fill="#463a7d">Regeneración estática incremental</text>
  </g>

  <!-- ══ FLECHAS ══ -->
  <defs>
    <marker id="f" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#40546b"/>
    </marker>
  </defs>
  <g stroke="#40546b" stroke-width="2" fill="none" marker-end="url(#f)">
    <path d="M220 193 L 313 193"/>
    <path d="M220 343 L 313 480"/>
    <path d="M965 720 L 1058 260"/>
    <path d="M965 375 L 1058 400"/>
    <path d="M965 550 L 1058 545"/>
  </g>
  <g font-size="12" fill="#40546b">
    <text x="228" y="185">HTTPS</text>
    <text x="228" y="425">HTTPS + sesión</text>
    <text x="975" y="520" transform="rotate(-78 975 520)">SQL / REST</text>
    <text x="972" y="368">Enlace</text>
    <text x="972" y="540">Despliegue</text>
  </g>

  <!-- Nota -->
  <rect x="40" y="840" width="1400" height="120" rx="6" fill="#fbfbfc" stroke="#c9d2da"/>
  <text x="60" y="868" font-size="14" font-weight="700" fill="#12181f">Frontera del sistema</text>
  <text x="60" y="892" font-size="13" fill="#40546b">El sistema NO procesa pagos: no existe pasarela ni campo donde introducir datos de tarjeta. La transacción económica ocurre</text>
  <text x="60" y="912" font-size="13" fill="#40546b">fuera del software, por WhatsApp y de forma presencial o por transferencia, y queda fuera del alcance de esta especificación.</text>
  <text x="60" y="938" font-size="13" fill="#40546b">El sistema tampoco gestiona logística de transporte ni liquidación de haberes.</text>
</svg>
