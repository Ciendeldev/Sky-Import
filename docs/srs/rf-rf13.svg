<svg xmlns="http://www.w3.org/2000/svg" width="760" height="623" viewBox="0 0 760 623" font-family="Arial, sans-serif">
  <title>RF13 — Control de existencias con aviso de mínimo</title><desc>Quién ajusta el stock y cómo se deriva la disponibilidad que ve el cliente.</desc>
  <rect width="760" height="623" fill="#ffffff"/>
  <defs><marker id="f-llena" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#263847"/></marker><marker id="f-abierta" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#455c6e" stroke-width="1.2"/></marker></defs>
  <rect x="18" y="10" width="74" height="30" rx="5" fill="#14212e"/>
  <text x="55" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff"><tspan x="55" dy="0">RF13</tspan></text>
  <text x="106" y="31" text-anchor="start" font-size="22" font-weight="700" fill="#14212e"><tspan x="106" dy="0">Control de existencias con aviso de mínimo</tspan></text>
  <rect x="18" y="49" width="724" height="178" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="73" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">CASO DE USO · ACTOR Y FUNCIÓN</tspan></text><rect x="249" y="83" width="479" height="134" rx="4" fill="#ffffff" stroke="#bac8d3"/><text x="259" y="102" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="259" dy="0">Sky Import</tspan></text><line x1="148" y1="133" x2="265" y2="129" stroke="#455c6e" stroke-width="1.4"/><g stroke="#956124" stroke-width="2" fill="none"><circle cx="122" cy="108" r="10" fill="#faf1e6"/><path d="M122 118 v30 m-23,-18 h46 m-23,18 l-18,23 m18,-23 l18,23"/></g><text x="122" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#704716"><tspan x="122" dy="0">Administrador</tspan></text><text x="122" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#455c6e"><tspan x="122" dy="0">y también el moderador</tspan></text><ellipse cx="488.5" cy="129" rx="223.5" ry="19" fill="#faf1e6" stroke="#956124" stroke-width="1.5"/><text x="488.5" y="134" text-anchor="middle" font-size="16" font-weight="400" fill="#704716"><tspan x="488.5" dy="0">Ajustar existencias</tspan></text><rect x="18" y="239" width="724" height="304" rx="6" fill="#ffffff" stroke="#bac8d3"/><text x="32" y="263" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">SECUENCIA · COMPORTAMIENTO DEL SISTEMA</tspan></text><rect x="24" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="97" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="97" dy="0">Administrador</tspan></text><line x1="97" y1="322" x2="97" y2="531" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="212.66666666666663" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="285.66666666666663" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="285.66666666666663" dy="0">Listado de</tspan><tspan x="285.66666666666663" dy="18">productos</tspan></text><line x1="285.66666666666663" y1="322" x2="285.66666666666663" y2="531" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="401.3333333333333" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="474.3333333333333" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="474.3333333333333" dy="0">Servidor</tspan></text><line x1="474.3333333333333" y1="322" x2="474.3333333333333" y2="531" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="590" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="663" dy="0">products</tspan></text><line x1="663" y1="322" x2="663" y2="531" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="55.6133333333334" y="328" width="271.4399999999998" height="19" rx="2" fill="#ffffff"/><text x="191.33333333333331" y="342" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="191.33333333333331" dy="0">1. escribe las unidades disponibles</tspan></text><line x1="97" y1="355" x2="285.66666666666663" y2="355" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="263.96000000000004" y="368" width="232.07999999999993" height="19" rx="2" fill="#ffffff"/><text x="380" y="382" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="380" dy="0">2. setStock(pieza, unidades)</tspan></text><line x1="285.66666666666663" y1="395" x2="474.3333333333333" y2="395" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="496.7066666666666" y="408" width="143.92000000000002" height="19" rx="2" fill="#ffffff"/><text x="568.6666666666666" y="422" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="568.6666666666666" dy="0">3. actualiza units</tspan></text><line x1="474.3333333333333" y1="435" x2="663" y2="435" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="501.34666666666664" y="448" width="134.64" height="19" rx="2" fill="#ffffff"/><text x="568.6666666666666" y="462" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="568.6666666666666" dy="0">4. valor grabado</tspan></text><line x1="663" y1="475" x2="474.3333333333333" y2="475" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="217.2400000000001" y="488" width="325.5199999999998" height="19" rx="2" fill="#ffffff"/><text x="380" y="502" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="380" dy="0">5. confirma el ajuste y revalida el listado</tspan></text><line x1="474.3333333333333" y1="515" x2="285.66666666666663" y2="515" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/>
  <text x="20" y="569" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="20" dy="0">El listado suma las variantes activas cuando existen; las alertas consultan products.units. La</tspan><tspan x="20" dy="18">coherencia entre ambos valores está pendiente de comprobación. El ajuste rápido modifica el stock</tspan><tspan x="20" dy="18">del producto.</tspan></text>
  </svg>
