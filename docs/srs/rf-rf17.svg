  <text x="106" y="31" text-anchor="start" font-size="22" font-weight="700" fill="#14212e"><tspan x="106" dy="0">Alta de cuentas de administración</tspan></text>
  <rect x="18" y="49" width="724" height="178" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="73" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">CASO DE USO · ACTOR Y FUNCIÓN</tspan></text><rect x="249" y="83" width="479" height="134" rx="4" fill="#ffffff" stroke="#bac8d3"/><text x="259" y="102" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="259" dy="0">Sky Import</tspan></text><line x1="148" y1="133" x2="265" y2="129" stroke="#455c6e" stroke-width="1.4"/><g stroke="#34734f" stroke-width="2" fill="none"><circle cx="122" cy="108" r="10" fill="#edf6ef"/><path d="M122 118 v30 m-23,-18 h46 m-23,18 l-18,23 m18,-23 l18,23"/></g><text x="122" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#27543c"><tspan x="122" dy="0">Moderador</tspan></text><text x="122" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#455c6e"><tspan x="122" dy="0">titular · usuario «Cielo»</tspan></text><ellipse cx="488.5" cy="129" rx="223.5" ry="19" fill="#edf6ef" stroke="#34734f" stroke-width="1.5"/><text x="488.5" y="134" text-anchor="middle" font-size="16" font-weight="400" fill="#27543c"><tspan x="488.5" dy="0">Crear una cuenta de administrador</tspan></text><rect x="18" y="239" width="724" height="428" rx="6" fill="#ffffff" stroke="#bac8d3"/><text x="32" y="263" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">SECUENCIA · COMPORTAMIENTO DEL SISTEMA</tspan></text><rect x="30.75" y="278" width="132.5" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="97" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="97" dy="0">Moderador</tspan></text><line x1="97" y1="322" x2="97" y2="655" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="172.25" y="278" width="132.5" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="238.5" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="238.5" dy="0">Configuración</tspan></text><line x1="238.5" y1="322" x2="238.5" y2="655" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="313.75" y="278" width="132.5" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="380" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="380" dy="0">Servidor</tspan></text><line x1="380" y1="322" x2="380" y2="655" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="455.25" y="278" width="132.5" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="521.5" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="521.5" dy="0">Autenticación</tspan></text><line x1="521.5" y1="322" x2="521.5" y2="655" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="596.75" y="278" width="132.5" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="663" dy="0">admin_users</tspan></text><line x1="663" y1="322" x2="663" y2="655" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="41.31000000000003" y="328" width="252.87999999999994" height="19" rx="2" fill="#ffffff"/><text x="167.75" y="342" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="167.75" dy="0">1. usuario, nombre y contraseña</tspan></text><line x1="97" y1="355" x2="238.5" y2="355" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="208.09000000000003" y="368" width="202.31999999999994" height="19" rx="2" fill="#ffffff"/><text x="309.25" y="382" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="309.25" dy="0">2. createPanelAccount()</tspan></text><line x1="238.5" y1="395" x2="380" y2="395" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="217.8800000000001" y="408" width="324.2399999999998" height="19" rx="2" fill="#ffffff"/><text x="380" y="422" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="380" dy="0">3. exige rol de moderador antes de seguir</tspan></text><path d="M380 435 h-30 v12 h30" fill="none" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="416.66" y="452" width="209.67999999999995" height="19" rx="2" fill="#ffffff"/><text x="521.5" y="466" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="521.5" dy="0">4. ¿ese usuario ya existe?</tspan></text><line x1="380" y1="479" x2="663" y2="479" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="288.4700000000001" y="492" width="324.55999999999983" height="19" rx="2" fill="#ffffff"/><text x="450.75" y="506" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="450.75" dy="0">5. crea la identidad con rol administrador</tspan></text><line x1="380" y1="519" x2="521.5" y2="519" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="372.47" y="532" width="156.56" height="19" rx="2" fill="#ffffff"/><text x="450.75" y="546" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="450.75" dy="0">6. identidad creada</tspan></text><line x1="521.5" y1="559" x2="380" y2="559" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="385.62000000000006" y="572" width="271.7599999999999" height="19" rx="2" fill="#ffffff"/><text x="521.5" y="586" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="521.5" dy="0">7. registra la pertenencia al panel</tspan></text><line x1="380" y1="599" x2="663" y2="599" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="235.29" y="612" width="147.92000000000002" height="19" rx="2" fill="#ffffff"/><text x="309.25" y="626" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="309.25" dy="0">8. alta confirmada</tspan></text><line x1="380" y1="639" x2="238.5" y2="639" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="18" y="679" width="724" height="94" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="703" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">COMPONENTES QUE INTERVIENEN</tspan></text><rect x="38" y="715" width="217.33333333333334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="723" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="741" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="146.66666666666669" y="743" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="146.66666666666669" dy="0">Gestión de cuentas</tspan></text><rect x="271.33333333333337" y="715" width="217.33333333333334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="266.33333333333337" y="723" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="266.33333333333337" y="741" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="380.00000000000006" y="743" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="380.00000000000006" dy="0">Autenticación</tspan></text><rect x="504.6666666666667" y="715" width="217.33333333333334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="499.6666666666667" y="723" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="499.6666666666667" y="741" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="613.3333333333334" y="743" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="613.3333333333334" dy="0">Guardia de sesión y rol</tspan></text>
  <text x="20" y="799" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="20" dy="0">El formulario no decide el rol: toda cuenta creada desde el panel nace como administrador. Si la</tspan><tspan x="20" dy="18">pertenencia no llega a registrarse, se elimina la identidad recién creada para no dejar una cuenta</tspan><tspan x="20" dy="18">huérfana.</tspan></text>
  </svg>
