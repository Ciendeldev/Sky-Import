  <text x="30" y="42" font-size="21" font-weight="700" fill="#12181f">RF06 · Gestión del carrito de compras</text>
  <text x="30" y="68" font-size="13.5" fill="#5b6875">Quién arma el carrito y qué hace el sistema para que sobreviva a cerrar el navegador.</text>
  <line x1="30" y1="84" x2="1430" y2="84" stroke="#c8d2dc" stroke-width="1.4"/>

  
  <rect x="30" y="108" width="470" height="350" rx="6" fill="#f7f9fb" stroke="#c8d2dc" stroke-width="1.4"/>
  <text x="46" y="134" font-size="12.5" font-weight="700" fill="#12181f" letter-spacing="1.2">CASO DE USO — QUIÉN LA USA</text>
  
    <g stroke="#3a6ea5" stroke-width="2.2" fill="none">
      <circle cx="108" cy="170" r="17" fill="#eef4fb"/>
      <line x1="108" y1="187" x2="108" y2="232"/>
      <line x1="80" y1="202" x2="136" y2="202"/>
      <line x1="108" y1="232" x2="86" y2="268"/>
      <line x1="108" y1="232" x2="130" y2="268"/>
    </g>
  <text x="108" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">Cliente</text>
  <text x="108" y="308" text-anchor="middle" font-size="11.5" fill="#5b6875">sin cuenta ni registro</text>
  
      <ellipse cx="368" cy="204" rx="118" ry="26" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.8"/>
      <text x="368" y="209" text-anchor="middle" font-size="12.5" fill="#1d3a5c">Agregar una pieza</text>
      <line x1="138" y1="208" x2="248" y2="204" stroke="#5b6875" stroke-width="1.3"/>
      <ellipse cx="368" cy="266" rx="118" ry="26" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.8"/>
      <text x="368" y="271" text-anchor="middle" font-size="12.5" fill="#1d3a5c">Cambiar cantidades</text>
      <line x1="138" y1="208" x2="248" y2="266" stroke="#5b6875" stroke-width="1.3"/>
      <ellipse cx="368" cy="328" rx="118" ry="26" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.8"/>
      <text x="368" y="333" text-anchor="middle" font-size="12.5" fill="#1d3a5c">Quitar una línea</text>
      <line x1="138" y1="208" x2="248" y2="328" stroke="#5b6875" stroke-width="1.3"/>
  
  <rect x="524" y="108" width="906" height="350" rx="6" fill="#ffffff" stroke="#c8d2dc" stroke-width="1.4"/>
  <text x="540" y="134" font-size="12.5" font-weight="700" fill="#12181f" letter-spacing="1.2">COMPORTAMIENTO — CÓMO RESPONDE EL SISTEMA</text>
  
      <rect x="500" y="152" width="168" height="40" rx="4" fill="#ffffff" stroke="#5b6875" stroke-width="1.6"/>
      <text x="584" y="177" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f3a45">Cliente</text>
      <line x1="584" y1="192" x2="584" y2="434" stroke="#9dbad6" stroke-width="1.3" stroke-dasharray="6 5"/>
      <rect x="762" y="152" width="168" height="40" rx="4" fill="#ffffff" stroke="#5b6875" stroke-width="1.6"/>
      <text x="846" y="177" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f3a45">Ficha de producto</text>
      <line x1="846" y1="192" x2="846" y2="434" stroke="#9dbad6" stroke-width="1.3" stroke-dasharray="6 5"/>
      <rect x="1024" y="152" width="168" height="40" rx="4" fill="#ffffff" stroke="#5b6875" stroke-width="1.6"/>
      <text x="1108" y="177" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f3a45">Carrito</text>
      <line x1="1108" y1="192" x2="1108" y2="434" stroke="#9dbad6" stroke-width="1.3" stroke-dasharray="6 5"/>
      <rect x="1286" y="152" width="168" height="40" rx="4" fill="#ffffff" stroke="#5b6875" stroke-width="1.6"/>
      <text x="1370" y="177" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f3a45">Almacenamiento local</text>
      <line x1="1370" y1="192" x2="1370" y2="434" stroke="#9dbad6" stroke-width="1.3" stroke-dasharray="6 5"/>
  <line x1="584" y1="226" x2="837" y2="226" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="715" y="218" text-anchor="middle" font-size="12" fill="#2f3a45">1. elige variante y cantidad</text><line x1="846" y1="270" x2="1099" y2="270" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="977" y="262" text-anchor="middle" font-size="12" fill="#2f3a45">2. agrega la línea</text><path d="M1108 304 h38 v22 h-38" fill="none" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="1154" y="306" text-anchor="start" font-size="12" fill="#2f3a45">3. suma el subtotal en dólares</text><line x1="1108" y1="368" x2="1361" y2="368" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="1239" y="360" text-anchor="middle" font-size="12" fill="#2f3a45">4. guarda el estado</text><line x1="1108" y1="412" x2="593" y2="412" stroke="#5b6875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#f-abierta)"/><text x="846" y="404" text-anchor="middle" font-size="12" fill="#5b6875">5. contador y subtotal al día</text>
  

  <text x="30" y="490" font-size="12" fill="#7a8794">El carrito vive únicamente en el navegador del cliente: el sistema no guarda carritos ajenos ni necesita que nadie se registre para tener uno.</text>
