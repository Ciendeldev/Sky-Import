<svg xmlns="http://www.w3.org/2000/svg" width="760" height="658" viewBox="0 0 760 658" font-family="Arial, sans-serif">
  <title>RF06 — Gestión del carrito de compras</title><desc>Quién arma el carrito y qué hace el sistema para que sobreviva a cerrar el navegador.</desc>
  <rect width="760" height="658" fill="#ffffff"/>
  <defs><marker id="f-llena" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#263847"/></marker><marker id="f-abierta" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#455c6e" stroke-width="1.2"/></marker></defs>
  <rect x="18" y="10" width="74" height="30" rx="5" fill="#14212e"/>
  <text x="55" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff"><tspan x="55" dy="0">RF06</tspan></text>
  <text x="106" y="31" text-anchor="start" font-size="22" font-weight="700" fill="#14212e"><tspan x="106" dy="0">Gestión del carrito de compras</tspan></text>
  <rect x="18" y="49" width="724" height="209" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="73" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">CASO DE USO · ACTOR Y FUNCIÓN</tspan></text><rect x="249" y="83" width="479" height="165" rx="4" fill="#ffffff" stroke="#bac8d3"/><text x="259" y="102" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="259" dy="0">Sky Import</tspan></text><line x1="148" y1="133" x2="265" y2="129" stroke="#455c6e" stroke-width="1.4"/><line x1="148" y1="133" x2="265" y2="174" stroke="#455c6e" stroke-width="1.4"/><line x1="148" y1="133" x2="265" y2="219" stroke="#455c6e" stroke-width="1.4"/><g stroke="#376b9d" stroke-width="2" fill="none"><circle cx="122" cy="108" r="10" fill="#edf4fb"/><path d="M122 118 v30 m-23,-18 h46 m-23,18 l-18,23 m18,-23 l18,23"/></g><text x="122" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#224c71"><tspan x="122" dy="0">Cliente</tspan></text><text x="122" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#455c6e"><tspan x="122" dy="0">sin cuenta ni registro</tspan></text><ellipse cx="488.5" cy="129" rx="223.5" ry="19" fill="#edf4fb" stroke="#376b9d" stroke-width="1.5"/><text x="488.5" y="134" text-anchor="middle" font-size="16" font-weight="400" fill="#224c71"><tspan x="488.5" dy="0">Agregar una pieza</tspan></text><ellipse cx="488.5" cy="174" rx="223.5" ry="19" fill="#edf4fb" stroke="#376b9d" stroke-width="1.5"/><text x="488.5" y="179" text-anchor="middle" font-size="16" font-weight="400" fill="#224c71"><tspan x="488.5" dy="0">Cambiar cantidades</tspan></text><ellipse cx="488.5" cy="219" rx="223.5" ry="19" fill="#edf4fb" stroke="#376b9d" stroke-width="1.5"/><text x="488.5" y="224" text-anchor="middle" font-size="16" font-weight="400" fill="#224c71"><tspan x="488.5" dy="0">Quitar una línea</tspan></text><rect x="18" y="270" width="724" height="308" rx="6" fill="#ffffff" stroke="#bac8d3"/><text x="32" y="294" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">SECUENCIA · COMPORTAMIENTO DEL SISTEMA</tspan></text><rect x="24" y="309" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="97" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="97" dy="0">Cliente</tspan></text><line x1="97" y1="353" x2="97" y2="566" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="212.66666666666663" y="309" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="285.66666666666663" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="285.66666666666663" dy="0">Ficha de producto</tspan></text><line x1="285.66666666666663" y1="353" x2="285.66666666666663" y2="566" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="401.3333333333333" y="309" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="474.3333333333333" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="474.3333333333333" dy="0">Carrito</tspan></text><line x1="474.3333333333333" y1="353" x2="474.3333333333333" y2="566" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="590" y="309" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="663" y="327" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="663" dy="0">Almacenamiento</tspan><tspan x="663" dy="18">local</tspan></text><line x1="663" y1="353" x2="663" y2="566" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="81.85333333333335" y="359" width="218.95999999999992" height="19" rx="2" fill="#ffffff"/><text x="191.33333333333331" y="373" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="191.33333333333331" dy="0">1. elige variante y cantidad</tspan></text><line x1="97" y1="386" x2="285.66666666666663" y2="386" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="307.88" y="399" width="144.24" height="19" rx="2" fill="#ffffff"/><text x="380" y="413" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="380" dy="0">2. agrega la línea</tspan></text><line x1="285.66666666666663" y1="426" x2="474.3333333333333" y2="426" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="356.05333333333334" y="439" width="236.55999999999995" height="19" rx="2" fill="#ffffff"/><text x="474.3333333333333" y="453" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="474.3333333333333" dy="0">3. suma el subtotal en dólares</tspan></text><path d="M474.3333333333333 466 h-30 v12 h30" fill="none" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="417.18666666666667" y="483" width="302.9599999999999" height="19" rx="2" fill="#ffffff"/><text x="568.6666666666666" y="497" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="568.6666666666666" dy="0">4. guarda líneas y copia de la variante</tspan></text><line x1="474.3333333333333" y1="510" x2="663" y2="510" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="150.10666666666668" y="523" width="271.1199999999999" height="19" rx="2" fill="#ffffff"/><text x="285.66666666666663" y="537" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="285.66666666666663" dy="0">5. contador y subtotal del carrito</tspan></text><line x1="474.3333333333333" y1="550" x2="97" y2="550" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/>
  <text x="20" y="604" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="20" dy="0">El carrito local guarda cantidades, identificadores y datos de la variante, que pueden conservar un</tspan><tspan x="20" dy="18">precio anterior. El registro del pedido revalida precios y stock en la base. No exige una cuenta del</tspan><tspan x="20" dy="18">cliente.</tspan></text>
  </svg>
