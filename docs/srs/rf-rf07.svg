<svg xmlns="http://www.w3.org/2000/svg" width="760" height="645" viewBox="0 0 760 645" font-family="Arial, sans-serif">
  <title>RF07 — Verificación de compatibilidad entre componentes</title><desc>Quién arma un equipo y cómo el sistema le avisa qué no encaja.</desc>
  <rect width="760" height="645" fill="#ffffff"/>
  <defs><marker id="f-llena" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#263847"/></marker><marker id="f-abierta" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#455c6e" stroke-width="1.2"/></marker></defs>
  <rect x="18" y="10" width="74" height="30" rx="5" fill="#14212e"/>
  <text x="55" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff"><tspan x="55" dy="0">RF07</tspan></text>
  <text x="106" y="31" text-anchor="start" font-size="22" font-weight="700" fill="#14212e"><tspan x="106" dy="0">Verificación de compatibilidad entre componentes</tspan></text>
  <rect x="18" y="49" width="724" height="178" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="73" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">CASO DE USO · ACTOR Y FUNCIÓN</tspan></text><rect x="249" y="83" width="479" height="134" rx="4" fill="#ffffff" stroke="#bac8d3"/><text x="259" y="102" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="259" dy="0">Sky Import</tspan></text><line x1="148" y1="133" x2="265" y2="129" stroke="#455c6e" stroke-width="1.4"/><line x1="148" y1="133" x2="265" y2="174" stroke="#455c6e" stroke-width="1.4"/><g stroke="#376b9d" stroke-width="2" fill="none"><circle cx="122" cy="108" r="10" fill="#edf4fb"/><path d="M122 118 v30 m-23,-18 h46 m-23,18 l-18,23 m18,-23 l18,23"/></g><text x="122" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#224c71"><tspan x="122" dy="0">Cliente</tspan></text><text x="122" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#455c6e"><tspan x="122" dy="0">sin cuenta ni registro</tspan></text><ellipse cx="488.5" cy="129" rx="223.5" ry="19" fill="#edf4fb" stroke="#376b9d" stroke-width="1.5"/><text x="488.5" y="134" text-anchor="middle" font-size="16" font-weight="400" fill="#224c71"><tspan x="488.5" dy="0">Armar un equipo</tspan></text><ellipse cx="488.5" cy="174" rx="223.5" ry="19" fill="#edf4fb" stroke="#376b9d" stroke-width="1.5"/><text x="488.5" y="179" text-anchor="middle" font-size="16" font-weight="400" fill="#224c71"><tspan x="488.5" dy="0">Probar el encendido</tspan></text><rect x="18" y="239" width="724" height="344" rx="6" fill="#ffffff" stroke="#bac8d3"/><text x="32" y="263" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">SECUENCIA · COMPORTAMIENTO DEL SISTEMA</tspan></text><rect x="24" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="97" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="97" dy="0">Cliente</tspan></text><line x1="97" y1="322" x2="97" y2="571" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="307" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="380" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="380" dy="0">Configurador</tspan></text><line x1="380" y1="322" x2="380" y2="571" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="590" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="663" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="663" dy="0">Reglas de</tspan><tspan x="663" dy="18">compatibilidad</tspan></text><line x1="663" y1="322" x2="663" y2="571" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="107.26000000000002" y="328" width="262.47999999999996" height="19" rx="2" fill="#ffffff"/><text x="238.5" y="342" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="238.5" dy="0">1. elige procesador y placa madre</tspan></text><line x1="97" y1="355" x2="380" y2="355" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="335.3000000000002" y="368" width="372.39999999999964" height="19" rx="2" fill="#ffffff"/><text x="521.5" y="382" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="521.5" dy="0">2. compara zócalo, memoria, vatiaje y milímetros</tspan></text><line x1="380" y1="395" x2="663" y2="395" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="426.26000000000005" y="408" width="190.4799999999999" height="19" rx="2" fill="#ffffff"/><text x="521.5" y="422" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="521.5" dy="0">3. choques encontrados</tspan></text><line x1="663" y1="435" x2="380" y2="435" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="80.7000000000001" y="448" width="315.5999999999998" height="19" rx="2" fill="#ffffff"/><text x="238.5" y="462" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="238.5" dy="0">4. muestra los avisos de incompatibilidad</tspan></text><line x1="380" y1="475" x2="97" y2="475" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="120.22000000000006" y="488" width="236.5599999999999" height="19" rx="2" fill="#ffffff"/><text x="238.5" y="502" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="238.5" dy="0">5. pide la prueba de encendido</tspan></text><line x1="97" y1="515" x2="380" y2="515" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="58.78000000000014" y="528" width="359.4399999999997" height="19" rx="2" fill="#ffffff"/><text x="238.5" y="542" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="238.5" dy="0">6. resultado de la prueba simulada y faltantes</tspan></text><line x1="380" y1="555" x2="97" y2="555" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/>
  <text x="20" y="609" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="20" dy="0">Solo lectura sobre los datos de compatibilidad del catálogo: verificar un armado no escribe nada en</tspan><tspan x="20" dy="18">la base.</tspan></text>
  </svg>
