<svg xmlns="http://www.w3.org/2000/svg" width="760" height="756" viewBox="0 0 760 756" font-family="Arial, sans-serif">
  <title>RF16 — Seguimiento interno de pedidos</title><desc>Quién sigue los pedidos y por qué los importes que ve no se recalculan.</desc>
  <rect width="760" height="756" fill="#ffffff"/>
  <defs><marker id="f-llena" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#263847"/></marker><marker id="f-abierta" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#455c6e" stroke-width="1.2"/></marker></defs>
  <rect x="18" y="10" width="74" height="30" rx="5" fill="#14212e"/>
  <text x="55" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff"><tspan x="55" dy="0">RF16</tspan></text>
  <text x="106" y="31" text-anchor="start" font-size="22" font-weight="700" fill="#14212e"><tspan x="106" dy="0">Seguimiento interno de pedidos</tspan></text>
  <rect x="18" y="49" width="724" height="209" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="73" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">CASO DE USO · ACTOR Y FUNCIÓN</tspan></text><rect x="249" y="83" width="479" height="165" rx="4" fill="#ffffff" stroke="#bac8d3"/><text x="259" y="102" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="259" dy="0">Sky Import</tspan></text><line x1="148" y1="133" x2="265" y2="129" stroke="#455c6e" stroke-width="1.4"/><line x1="148" y1="133" x2="265" y2="174" stroke="#455c6e" stroke-width="1.4"/><line x1="148" y1="133" x2="265" y2="219" stroke="#455c6e" stroke-width="1.4"/><g stroke="#956124" stroke-width="2" fill="none"><circle cx="122" cy="108" r="10" fill="#faf1e6"/><path d="M122 118 v30 m-23,-18 h46 m-23,18 l-18,23 m18,-23 l18,23"/></g><text x="122" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#704716"><tspan x="122" dy="0">Administrador</tspan></text><text x="122" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#455c6e"><tspan x="122" dy="0">y también el moderador</tspan></text><ellipse cx="488.5" cy="129" rx="223.5" ry="19" fill="#faf1e6" stroke="#956124" stroke-width="1.5"/><text x="488.5" y="134" text-anchor="middle" font-size="16" font-weight="400" fill="#704716"><tspan x="488.5" dy="0">Consultar el historial</tspan></text><ellipse cx="488.5" cy="174" rx="223.5" ry="19" fill="#faf1e6" stroke="#956124" stroke-width="1.5"/><text x="488.5" y="179" text-anchor="middle" font-size="16" font-weight="400" fill="#704716"><tspan x="488.5" dy="0">Cambiar el estado</tspan></text><ellipse cx="488.5" cy="219" rx="223.5" ry="19" fill="#faf1e6" stroke="#956124" stroke-width="1.5"/><text x="488.5" y="224" text-anchor="middle" font-size="16" font-weight="400" fill="#704716"><tspan x="488.5" dy="0">Anotar una observación</tspan></text><rect x="18" y="270" width="724" height="424" rx="6" fill="#ffffff" stroke="#bac8d3"/><text x="32" y="294" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">SECUENCIA · COMPORTAMIENTO DEL SISTEMA</tspan></text><rect x="24" y="309" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="97" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="97" dy="0">Administrador</tspan></text><line x1="97" y1="353" x2="97" y2="682" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="212.66666666666663" y="309" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="285.66666666666663" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="285.66666666666663" dy="0">Panel de pedidos</tspan></text><line x1="285.66666666666663" y1="353" x2="285.66666666666663" y2="682" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="401.3333333333333" y="309" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="474.3333333333333" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="474.3333333333333" dy="0">Servidor</tspan></text><line x1="474.3333333333333" y1="353" x2="474.3333333333333" y2="682" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="590" y="309" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="663" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="663" dy="0">orders</tspan></text><line x1="663" y1="353" x2="663" y2="682" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="114.57333333333332" y="359" width="153.51999999999998" height="19" rx="2" fill="#ffffff"/><text x="191.33333333333331" y="373" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="191.33333333333331" dy="0">1. abre el historial</tspan></text><line x1="97" y1="386" x2="285.66666666666663" y2="386" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="300.68" y="399" width="158.64" height="19" rx="2" fill="#ffffff"/><text x="380" y="413" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="380" dy="0">2. listOrders(200)</tspan></text><line x1="285.66666666666663" y1="426" x2="474.3333333333333" y2="426" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="348.3200000000004" y="439" width="373.67999999999967" height="19" rx="2" fill="#ffffff"/><text x="535.1600000000002" y="453" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="535.1600000000002" dy="0">3. lee hasta 200 pedidos recientes y sus líneas</tspan></text><line x1="474.3333333333333" y1="466" x2="663" y2="466" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="411.04" y="479" width="310.9599999999999" height="19" rx="2" fill="#ffffff"/><text x="566.52" y="493" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="566.52" dy="0">4. importes y tasa tal como se grabaron</tspan></text><line x1="663" y1="506" x2="474.3333333333333" y2="506" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="290.28000000000003" y="519" width="179.43999999999994" height="19" rx="2" fill="#ffffff"/><text x="380" y="533" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="380" dy="0">5. muestra el historial</tspan></text><line x1="474.3333333333333" y1="546" x2="285.66666666666663" y2="546" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="38" y="559" width="311.5999999999999" height="19" rx="2" fill="#ffffff"/><text x="193.79999999999995" y="573" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="193.79999999999995" dy="0">6. cambia el estado o anota algo interno</tspan></text><line x1="97" y1="586" x2="285.66666666666663" y2="586" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="222.60000000000005" y="599" width="314.7999999999999" height="19" rx="2" fill="#ffffff"/><text x="380" y="613" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="380" dy="0">7. setOrderStatus() · setOrderNote()</tspan></text><line x1="285.66666666666663" y1="626" x2="474.3333333333333" y2="626" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="463.8266666666666" y="639" width="209.68" height="19" rx="2" fill="#ffffff"/><text x="568.6666666666666" y="653" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="568.6666666666666" dy="0">8. actualiza estado y nota</tspan></text><line x1="474.3333333333333" y1="666" x2="663" y2="666" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/>
  <text x="20" y="720" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="20" dy="0">El historial muestra hasta 200 pedidos recientes y el tablero hasta 50. Los importes y la tasa</tspan><tspan x="20" dy="18">conservan sus valores históricos. El límite de visualización no elimina los pedidos anteriores.</tspan></text>
  </svg>
