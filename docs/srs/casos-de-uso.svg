<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1180" viewBox="0 0 1560 1180" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1560" height="1180" fill="#ffffff"/>

  <text x="780" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#12181f">
    Diagrama de casos de uso — Sky Import
  </text>
  <text x="780" y="76" text-anchor="middle" font-size="16" fill="#5b6875">
    Actores del sistema y funciones que cada uno alcanza · UML 2.5
  </text>

  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6875"/>
    </marker>
    <marker id="hueca" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
      <path d="M0,0 L13,6 L0,12 z" fill="#ffffff" stroke="#5b6875" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- ═══════════════ FRONTERA DEL SISTEMA ═══════════════ -->
  <rect x="360" y="112" width="800" height="1010" rx="10" fill="#f7f9fb" stroke="#12181f" stroke-width="2.5"/>
  <text x="760" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#12181f" letter-spacing="2">
    SISTEMA SKY IMPORT
  </text>

  <!-- ── zona pública ── -->
  <rect x="384" y="160" width="366" height="452" rx="8" fill="#eef4fb" stroke="#9dbad6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="567" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c" letter-spacing="1.5">TIENDA PÚBLICA</text>

  <g fill="#ffffff" stroke="#3a6ea5" stroke-width="1.8">
    <ellipse cx="567" cy="216" rx="152" ry="21"/>
    <ellipse cx="567" cy="264" rx="152" ry="21"/>
    <ellipse cx="567" cy="312" rx="152" ry="21"/>
    <ellipse cx="567" cy="360" rx="152" ry="21"/>
    <ellipse cx="567" cy="408" rx="152" ry="21"/>
    <ellipse cx="567" cy="456" rx="152" ry="21"/>
    <ellipse cx="567" cy="504" rx="152" ry="21"/>
    <ellipse cx="567" cy="552" rx="152" ry="21"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1d3a5c">
    <text x="567" y="221">Consultar y filtrar el catálogo <tspan fill="#7a8794">· RF02</tspan></text>
    <text x="567" y="269">Buscar sin acentos ni mayúsculas <tspan fill="#7a8794">· RF03</tspan></text>
    <text x="567" y="317">Elegir variante de un producto <tspan fill="#7a8794">· RF04</tspan></text>
    <text x="567" y="365">Verificar compatibilidad <tspan fill="#7a8794">· RF07</tspan></text>
    <text x="567" y="413">Ver precio en tres monedas <tspan fill="#7a8794">· RF08</tspan></text>
    <text x="567" y="461">Gestionar el carrito <tspan fill="#7a8794">· RF06</tspan></text>
    <text x="567" y="509">Aplicar cupón de descuento <tspan fill="#7a8794">· RF09</tspan></text>
    <text x="567" y="557">Registrar el pedido <tspan fill="#7a8794">· RF10</tspan></text>
  </g>

  <!-- ── zona panel ── -->
  <rect x="384" y="636" width="366" height="292" rx="8" fill="#fdf1e3" stroke="#d8ab6d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="567" y="660" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4d12" letter-spacing="1.5">PANEL · ADMINISTRACIÓN</text>

  <g fill="#ffffff" stroke="#b5762f" stroke-width="1.8">
    <ellipse cx="567" cy="692" rx="152" ry="21"/>
    <ellipse cx="567" cy="740" rx="152" ry="21"/>
    <ellipse cx="567" cy="788" rx="152" ry="21"/>
    <ellipse cx="567" cy="836" rx="152" ry="21"/>
    <ellipse cx="567" cy="884" rx="152" ry="21"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#7a4d12">
    <text x="567" y="697">Administrar productos y variantes <tspan fill="#9a8054">· RF12</tspan></text>
    <text x="567" y="745">Controlar existencias <tspan fill="#9a8054">· RF13</tspan></text>
    <text x="567" y="793">Configurar precios y tasa <tspan fill="#9a8054">· RF14</tspan></text>
    <text x="567" y="841">Administrar cupones <tspan fill="#9a8054">· RF15</tspan></text>
    <text x="567" y="889">Seguir los pedidos <tspan fill="#9a8054">· RF16</tspan></text>
  </g>

  <!-- ── zona moderación ── -->
  <rect x="790" y="636" width="346" height="340" rx="8" fill="#eaf3ee" stroke="#7fae95" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="963" y="660" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4a35" letter-spacing="1.5">EXCLUSIVO DEL MODERADOR</text>

  <g fill="#ffffff" stroke="#2c7a54" stroke-width="1.8">
    <ellipse cx="963" cy="692" rx="146" ry="21"/>
    <ellipse cx="963" cy="740" rx="146" ry="21"/>
    <ellipse cx="963" cy="788" rx="146" ry="21"/>
    <ellipse cx="963" cy="836" rx="146" ry="21"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1f4a35">
    <text x="963" y="697">Crear cuentas del panel <tspan fill="#6d8a7b">· RF17</tspan></text>
    <text x="963" y="745">Retirar y devolver acceso <tspan fill="#6d8a7b">· RF18</tspan></text>
    <text x="963" y="793">Restablecer clave ajena <tspan fill="#6d8a7b">· RF21</tspan></text>
    <text x="963" y="841">Dar de baja pedidos <tspan fill="#6d8a7b">· RF20</tspan></text>
  </g>
  <text x="963" y="898" text-anchor="middle" font-size="12" fill="#4a6b5b">El servidor comprueba el rol en cada</text>
  <text x="963" y="914" text-anchor="middle" font-size="12" fill="#4a6b5b">operación: no basta ocultar el control.</text>

  <!-- ── casos comunes a todo el panel ── -->
  <g fill="#ffffff" stroke="#5b6875" stroke-width="1.8">
    <ellipse cx="963" cy="216" rx="146" ry="21"/>
    <ellipse cx="963" cy="264" rx="146" ry="21"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#2f3a45">
    <text x="963" y="221">Iniciar sesión en el panel <tspan fill="#7a8794">· RF01</tspan></text>
    <text x="963" y="269">Cambiar la contraseña propia <tspan fill="#7a8794">· RF19</tspan></text>
  </g>

  <!-- ── cierre por WhatsApp ── -->
  <g fill="#ffffff" stroke="#3a6ea5" stroke-width="1.8">
    <ellipse cx="963" cy="392" rx="146" ry="21"/>
    <ellipse cx="963" cy="440" rx="146" ry="21"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1d3a5c">
    <text x="963" y="397">Comprar una pieza directo <tspan fill="#7a8794">· RF05</tspan></text>
    <text x="963" y="445">Generar mensaje del pedido <tspan fill="#7a8794">· RF11</tspan></text>
  </g>
  <text x="963" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c" letter-spacing="1.5">CIERRE DE VENTA</text>

  <!-- «include» del registro hacia el mensaje -->
  <path d="M719 552 C 800 552, 830 480, 830 452" fill="none" stroke="#5b6875" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#flecha)"/>
  <text x="806" y="520" font-size="11.5" fill="#5b6875" font-style="italic">«include»</text>

  <!-- ═══════════════ ACTORES ═══════════════ -->
  <!-- Cliente -->
  <g stroke="#3a6ea5" stroke-width="2.4" fill="none">
    <circle cx="150" cy="330" r="22" fill="#eef4fb"/>
    <line x1="150" y1="352" x2="150" y2="410"/>
    <line x1="112" y1="372" x2="188" y2="372"/>
    <line x1="150" y1="410" x2="120" y2="458"/>
    <line x1="150" y1="410" x2="180" y2="458"/>
  </g>
  <text x="150" y="486" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3a5c">Cliente</text>
  <text x="150" y="506" text-anchor="middle" font-size="13" fill="#40546b">Visitante público</text>
  <text x="150" y="524" text-anchor="middle" font-size="13" fill="#40546b">Sin cuenta ni registro</text>

  <!-- Administrador -->
  <g stroke="#b5762f" stroke-width="2.4" fill="none">
    <circle cx="1410" cy="690" r="22" fill="#fdf1e3"/>
    <line x1="1410" y1="712" x2="1410" y2="770"/>
    <line x1="1372" y1="732" x2="1448" y2="732"/>
    <line x1="1410" y1="770" x2="1380" y2="818"/>
    <line x1="1410" y1="770" x2="1440" y2="818"/>
  </g>
  <text x="1410" y="846" text-anchor="middle" font-size="16" font-weight="700" fill="#7a4d12">Administrador</text>
  <text x="1410" y="866" text-anchor="middle" font-size="13" fill="#5e4520">Personal del comercio</text>

  <!-- Moderador -->
  <g stroke="#2c7a54" stroke-width="2.4" fill="none">
    <circle cx="1410" cy="990" r="22" fill="#eaf3ee"/>
    <line x1="1410" y1="1012" x2="1410" y2="1070"/>
    <line x1="1372" y1="1032" x2="1448" y2="1032"/>
    <line x1="1410" y1="1070" x2="1380" y2="1118"/>
    <line x1="1410" y1="1070" x2="1440" y2="1118"/>
  </g>
  <text x="1410" y="1146" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4a35">Moderador</text>
  <text x="1410" y="1166" text-anchor="middle" font-size="13" fill="#3c5f4c">Titular · usuario «Cielo»</text>

  <!-- generalización Moderador → Administrador -->
  <line x1="1410" y1="962" x2="1410" y2="886" stroke="#5b6875" stroke-width="1.8" marker-end="url(#hueca)"/>
  <text x="1424" y="928" font-size="12" fill="#5b6875">hereda todo lo del</text>
  <text x="1424" y="944" font-size="12" fill="#5b6875">administrador</text>

  <!-- Sistema externo WhatsApp -->
  <rect x="1300" y="376" width="220" height="82" rx="6" fill="#eaf3ee" stroke="#2c7a54" stroke-width="2"/>
  <text x="1410" y="404" text-anchor="middle" font-size="12" fill="#3c5f4c" font-style="italic">«sistema externo»</text>
  <text x="1410" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4a35">WhatsApp</text>
  <text x="1410" y="448" text-anchor="middle" font-size="12" fill="#3c5f4c">Única vía de cierre</text>

  <!-- ═══════════════ ASOCIACIONES ═══════════════ -->
  <g stroke="#5b6875" stroke-width="1.4" fill="none">
    <!-- cliente → tienda pública -->
    <line x1="192" y1="352" x2="413" y2="222"/>
    <line x1="192" y1="360" x2="413" y2="268"/>
    <line x1="192" y1="368" x2="413" y2="314"/>
    <line x1="196" y1="378" x2="413" y2="362"/>
    <line x1="196" y1="392" x2="413" y2="410"/>
    <line x1="192" y1="404" x2="413" y2="458"/>
    <line x1="188" y1="416" x2="413" y2="506"/>
    <line x1="182" y1="428" x2="413" y2="554"/>
    <!-- cliente → compra directa: por el pasillo libre entre la caja pública y
         la del panel. Cruzar por encima dejaba la línea sobre los casos de uso.
         «Generar mensaje» no lleva línea propia: le llega por el «include». -->
    <path d="M188 448 C 260 560, 330 624, 430 624 L 776 624 C 806 624, 818 500, 819 414"/>
    <!-- panel: administrador -->
    <line x1="1368" y1="700" x2="1113" y2="694"/>
    <line x1="1368" y1="712" x2="1113" y2="742"/>
    <line x1="1372" y1="722" x2="1113" y2="790"/>
    <line x1="1372" y1="734" x2="1113" y2="838"/>
    <line x1="1372" y1="746" x2="1113" y2="886"/>
    <!-- administrador → sesión y clave propia -->
    <line x1="1380" y1="672" x2="1109" y2="272"/>
    <line x1="1392" y1="668" x2="1109" y2="222"/>
    <!-- moderador → exclusivos -->
    <line x1="1368" y1="984" x2="1109" y2="700" stroke="#2c7a54"/>
    <line x1="1368" y1="996" x2="1109" y2="748" stroke="#2c7a54"/>
    <line x1="1368" y1="1008" x2="1109" y2="796" stroke="#2c7a54"/>
    <line x1="1368" y1="1020" x2="1109" y2="844" stroke="#2c7a54"/>
    <!-- whatsapp -->
    <line x1="1298" y1="412" x2="1109" y2="396" stroke="#2c7a54"/>
    <line x1="1298" y1="428" x2="1109" y2="442" stroke="#2c7a54"/>
  </g>

  <!-- leyenda -->
  <rect x="40" y="962" width="290" height="176" rx="8" fill="#f7f9fb" stroke="#c8d2dc" stroke-width="1.4"/>
  <text x="60" y="990" font-size="13" font-weight="700" fill="#12181f" letter-spacing="1.2">REFERENCIAS</text>
  <g font-size="12.5" fill="#40546b">
    <text x="60" y="1016">RFnn · requisito funcional del apartado 3.2</text>
    <text x="60" y="1040">«include» · el caso base ejecuta siempre al otro</text>
    <text x="60" y="1064">Triángulo hueco · generalización de actores</text>
    <text x="60" y="1088">El moderador es un administrador que además</text>
    <text x="60" y="1104">gobierna las cuentas y da de baja pedidos.</text>
    <text x="60" y="1128" fill="#7a8794">El cliente nunca se autentica: no hay registro.</text>
  </g>
</svg>
