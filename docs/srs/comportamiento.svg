<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1150" viewBox="0 0 1000 1150" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#65788b" stroke-width="1.5"/></marker><marker id="solid" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9 Z" fill="#182431"/></marker><marker id="general" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M1,1 L15,7 L1,13 Z" fill="white" stroke="#65788b" stroke-width="1.6"/></marker></defs><rect width="1000" height="1150" fill="white"/><text x="40" y="43" font-size="28" fill="#182431" text-anchor="start" font-weight="700"><tspan x="40" dy="0">26 · Secuencia del pedido por checkout</tspan></text><text x="40" y="76" font-size="20" fill="#4c5c6b" text-anchor="start" font-weight="400"><tspan x="40" dy="0">UML · Compra directa de una pieza fuera de esta secuencia</tspan></text><rect x="20" y="108" width="150" height="72" rx="8" fill="#f7f9fb" stroke="#b8c7d4" stroke-width="2"/><text x="95" y="138" font-size="22" fill="#182431" text-anchor="middle" font-weight="700"><tspan x="95" dy="0">Cliente</tspan></text><text x="95" y="164" font-size="20" fill="#4c5c6b" text-anchor="middle" font-weight="400"><tspan x="95" dy="0">actor</tspan></text><path d="M95 180 V1120" fill="none" stroke="#b8c7d4" stroke-width="2" stroke-dasharray="7 5"/><rect x="275" y="108" width="150" height="72" rx="8" fill="#f7f9fb" stroke="#b8c7d4" stroke-width="2"/><text x="350" y="138" font-size="22" fill="#182431" text-anchor="middle" font-weight="700"><tspan x="350" dy="0">Tienda</tspan></text><text x="350" y="164" font-size="20" fill="#4c5c6b" text-anchor="middle" font-weight="400"><tspan x="350" dy="0">navegador</tspan></text><path d="M350 180 V1120" fill="none" stroke="#b8c7d4" stroke-width="2" stroke-dasharray="7 5"/><rect x="605" y="108" width="190" height="72" rx="8" fill="#f7f9fb" stroke="#b8c7d4" stroke-width="2"/><text x="700" y="138" font-size="22" fill="#182431" text-anchor="middle" font-weight="700"><tspan x="700" dy="0">Supabase</tspan></text><text x="700" y="164" font-size="20" fill="#4c5c6b" text-anchor="middle" font-weight="400"><tspan x="700" dy="0">API + PostgreSQL</tspan></text><path d="M700 180 V1120" fill="none" stroke="#b8c7d4" stroke-width="2" stroke-dasharray="7 5"/><rect x="845" y="108" width="150" height="72" rx="8" fill="#f7f9fb" stroke="#b8c7d4" stroke-width="2"/><text x="920" y="138" font-size="22" fill="#182431" text-anchor="middle" font-weight="700"><tspan x="920" dy="0">WhatsApp</tspan></text><text x="920" y="164" font-size="20" fill="#4c5c6b" text-anchor="middle" font-weight="400"><tspan x="920" dy="0">externo</tspan></text><path d="M920 180 V1120" fill="none" stroke="#b8c7d4" stroke-width="2" stroke-dasharray="7 5"/><text x="222.5" y="212" font-size="20" fill="#182431" text-anchor="middle" font-weight="400"><tspan x="222.5" dy="0">1. Selecciona piezas</tspan></text><path d="M95 224 H350" fill="none" stroke="#182431" stroke-width="2" marker-end="url(#solid)"/><text x="222.5" y="264" font-size="20" fill="#182431" text-anchor="middle" font-weight="400"><tspan x="222.5" dy="0">2. Completa entrega</tspan></text><path d="M95 276 H350" fill="none" stroke="#182431" stroke-width="2" marker-end="url(#solid)"/><rect x="262" y="301" width="513" height="141" rx="0" fill="none" stroke="#65788b" stroke-width="2"/><rect x="262" y="301" width="60" height="31" rx="0" fill="#f1f4f7" stroke="#65788b" stroke-width="2"/><text x="274" y="324" font-size="20" fill="#182431" text-anchor="start" font-weight="700"><tspan x="274" dy="0">opt</tspan></text><text x="336" y="324" font-size="20" fill="#182431" text-anchor="start" font-weight="400"><tspan x="336" dy="0">[hay código de cupón]</tspan></text><text x="525" y="356" font-size="20" fill="#182431" text-anchor="middle" font-weight="400"><tspan x="525" dy="0">3. validate_coupon(código)</tspan></text><path d="M350 368 H700" fill="none" stroke="#182431" stroke-width="2" marker-end="url(#solid)"/><text x="525" y="407" font-size="20" fill="#182431" text-anchor="middle" font-weight="400"><tspan x="525" dy="0">4. Resultado de validación</tspan></text><path d="M700 419 H350" fill="none" stroke="#182431" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="525" y="478" font-size="20" fill="#182431" text-anchor="middle" font-weight="400"><tspan x="525" dy="0">5. place_order(datos y cantidades)</tspan></text><path d="M350 490 H700" fill="none" stroke="#182431" stroke-width="2" marker-end="url(#solid)"/><rect x="505" y="514" width="450" height="99" rx="8" fill="#edf5ef" stroke="#285a43" stroke-width="2"/><text x="525" y="543" font-size="20" fill="#285a43" text-anchor="start" font-weight="400"><tspan x="525" dy="0">Relee precios y comprueba stock.</tspan><tspan x="525" dy="25">Si procede: descuenta y graba todo.</tspan><tspan x="525" dy="25">Ante error: revierte la transacción.</tspan></text><rect x="30" y="635" width="745" height="289" rx="0" fill="none" stroke="#65788b" stroke-width="2"/><rect x="30" y="635" width="60" height="31" rx="0" fill="#f1f4f7" stroke="#65788b" stroke-width="2"/><text x="42" y="658" font-size="20" fill="#182431" text-anchor="start" font-weight="700"><tspan x="42" dy="0">alt</tspan></text><text x="104" y="658" font-size="20" fill="#182431" text-anchor="start" font-weight="400"><tspan x="104" dy="0">[registro correcto]</tspan></text><text x="525" y="681" font-size="20" fill="#182431" text-anchor="middle" font-weight="400"><tspan x="525" dy="0">6a. Número e importes persistidos</tspan></text><path d="M700 693 H350" fill="none" stroke="#182431" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M30 719 H775" fill="none" stroke="#65788b" stroke-width="2" stroke-dasharray="7 5"/><text x="46" y="747" font-size="20" fill="#845c26" text-anchor="start" font-weight="400"><tspan x="46" dy="0">[no disponible]</tspan></text><text x="525" y="780" font-size="20" fill="#845c26" text-anchor="middle" font-weight="400"><tspan x="525" dy="0">6b. Bloqueado; no registra</tspan></text><path d="M700 792 H350" fill="none" stroke="#845c26" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="222.5" y="825" font-size="20" fill="#845c26" text-anchor="middle" font-weight="400"><tspan x="222.5" dy="0">Mostrar error; termina</tspan></text><path d="M350 837 H95" fill="none" stroke="#845c26" stroke-width="2" marker-end="url(#solid)"/><path d="M30 853 H775" fill="none" stroke="#65788b" stroke-width="2" stroke-dasharray="7 5"/><text x="46" y="879" font-size="20" fill="#4c5c6b" text-anchor="start" font-weight="400"><tspan x="46" dy="0">[fallo técnico de registro]</tspan></text><path d="M350 884 H394 V914 H350" fill="none" stroke="#182431" stroke-width="2" marker-end="url(#solid)"/><text x="420" y="905" font-size="20" fill="#182431" text-anchor="start" font-weight="400"><tspan x="420" dy="0">6c. Sin registro ni número</tspan></text><rect x="262" y="949" width="703" height="159" rx="0" fill="none" stroke="#65788b" stroke-width="2"/><rect x="262" y="949" width="60" height="31" rx="0" fill="#f1f4f7" stroke="#65788b" stroke-width="2"/><text x="274" y="972" font-size="20" fill="#182431" text-anchor="start" font-weight="700"><tspan x="274" dy="0">opt</tspan></text><text x="336" y="972" font-size="20" fill="#182431" text-anchor="start" font-weight="400"><tspan x="336" dy="0">[registrado o sin-registro]</tspan></text><path d="M350 987 H400 V1016 H350" fill="none" stroke="#182431" stroke-width="2" marker-end="url(#solid)"/><text x="430" y="1005" font-size="20" fill="#182431" text-anchor="start" font-weight="400"><tspan x="430" dy="0">7. Redacta con importes persistidos</tspan><tspan x="430" dy="25">o datos disponibles si no registró.</tspan></text><text x="635" y="1077" font-size="20" fill="#182431" text-anchor="middle" font-weight="400"><tspan x="635" dy="0">8. Abre el enlace con el mensaje</tspan></text><path d="M350 1089 H920" fill="none" stroke="#182431" stroke-width="2" marker-end="url(#solid)"/><text x="40" y="1136" font-size="20" fill="#4c5c6b" text-anchor="start" font-weight="400"><tspan x="40" dy="0">El cliente decide si envía el mensaje. Abrir WhatsApp no confirma pago ni venta.</tspan></text></svg>