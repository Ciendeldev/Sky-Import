<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1420" viewBox="0 0 1560 1420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1560" height="1420" fill="#ffffff"/>

  <text x="780" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#12181f">
    Diagrama de comportamiento — cierre de una venta
  </text>
  <text x="780" y="76" text-anchor="middle" font-size="16" fill="#5b6875">
    Secuencia de acciones desde la consulta del catálogo hasta la conversación · UML 2.5
  </text>

  <defs>
    <marker id="m-llena" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#2f3a45"/>
    </marker>
    <marker id="m-abierta" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9" fill="none" stroke="#5b6875" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- ═══════ PARTICIPANTES ═══════ -->
  <g>
    <rect x="40" y="112" width="180" height="60" rx="5" fill="#eef4fb" stroke="#3a6ea5" stroke-width="2"/>
    <text x="130" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">Cliente</text>
    <text x="130" y="158" text-anchor="middle" font-size="12" fill="#40546b">actor</text>
  </g>
  <g>
    <rect x="268" y="112" width="180" height="60" rx="5" fill="#ffffff" stroke="#3a6ea5" stroke-width="2"/>
    <text x="358" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">Vitrina</text>
    <text x="358" y="158" text-anchor="middle" font-size="12" fill="#40546b">navegador</text>
  </g>
  <g>
    <rect x="496" y="112" width="180" height="60" rx="5" fill="#ffffff" stroke="#3a6ea5" stroke-width="2"/>
    <text x="586" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">Carrito</text>
    <text x="586" y="158" text-anchor="middle" font-size="12" fill="#40546b">almacenamiento local</text>
  </g>
  <g>
    <rect x="724" y="112" width="180" height="60" rx="5" fill="#f7f9fb" stroke="#12181f" stroke-width="2"/>
    <text x="814" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#12181f">Servidor</text>
    <text x="814" y="158" text-anchor="middle" font-size="12" fill="#40546b">Next.js</text>
  </g>
  <g>
    <rect x="952" y="112" width="200" height="60" rx="5" fill="#eaf3ee" stroke="#2c7a54" stroke-width="2"/>
    <text x="1052" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4a35">Base de datos</text>
    <text x="1052" y="158" text-anchor="middle" font-size="12" fill="#3c5f4c">PostgreSQL · Supabase</text>
  </g>
  <g>
    <rect x="1200" y="112" width="180" height="60" rx="5" fill="#eaf3ee" stroke="#2c7a54" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="1290" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4a35">WhatsApp</text>
    <text x="1290" y="158" text-anchor="middle" font-size="12" fill="#3c5f4c">sistema externo</text>
  </g>

  <!-- ═══════ LÍNEAS DE VIDA ═══════ -->
  <g stroke="#9dbad6" stroke-width="1.4" stroke-dasharray="7 6">
    <line x1="130" y1="172" x2="130" y2="1226"/>
    <line x1="358" y1="172" x2="358" y2="1226"/>
    <line x1="586" y1="172" x2="586" y2="1226"/>
    <line x1="814" y1="172" x2="814" y2="1226"/>
    <line x1="1052" y1="172" x2="1052" y2="1226"/>
    <line x1="1290" y1="172" x2="1290" y2="1226"/>
  </g>

  <!-- ═══════ MENSAJES ═══════ -->
  <g font-size="13" fill="#2f3a45">

    <!-- 1 · consultar catálogo -->
    <line x1="130" y1="216" x2="352" y2="216" stroke="#2f3a45" stroke-width="1.6" marker-end="url(#m-llena)"/>
    <text x="150" y="208">1. Consulta el catálogo y abre una ficha</text>
    <rect x="352" y="208" width="12" height="60" fill="#dfe9f3" stroke="#3a6ea5" stroke-width="1.2"/>

    <line x1="352" y1="252" x2="136" y2="252" stroke="#5b6875" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#m-abierta)"/>
    <text x="150" y="244" fill="#5b6875">2. Precio en dólares, guaraníes y reales</text>

    <!-- 3 · agregar al carrito -->
    <line x1="130" y1="304" x2="580" y2="304" stroke="#2f3a45" stroke-width="1.6" marker-end="url(#m-llena)"/>
    <text x="150" y="296">3. Agrega la pieza al carrito</text>
    <rect x="580" y="296" width="12" height="52" fill="#dfe9f3" stroke="#3a6ea5" stroke-width="1.2"/>
    <line x1="580" y1="336" x2="136" y2="336" stroke="#5b6875" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#m-abierta)"/>
    <text x="150" y="328" fill="#5b6875">4. El carrito sobrevive a cerrar el navegador</text>

    <!-- 5 · checkout -->
    <line x1="130" y1="388" x2="352" y2="388" stroke="#2f3a45" stroke-width="1.6" marker-end="url(#m-llena)"/>
    <text x="150" y="380">5. Completa nombre, teléfono y destino</text>
    <rect x="352" y="380" width="12" height="500" fill="#dfe9f3" stroke="#3a6ea5" stroke-width="1.2"/>
  </g>

  <!-- ═══════ FRAGMENTO OPCIONAL · CUPÓN ═══════ -->
  <rect x="300" y="416" width="880" height="132" rx="4" fill="none" stroke="#b5762f" stroke-width="1.6"/>
  <path d="M300 416 h84 v24 l-14 14 H300 z" fill="#fdf1e3" stroke="#b5762f" stroke-width="1.6"/>
  <text x="316" y="434" font-size="12.5" font-weight="700" fill="#7a4d12">opcional</text>
  <text x="400" y="434" font-size="12.5" fill="#7a4d12">[el cliente escribió un código de cupón]</text>

  <g font-size="13" fill="#2f3a45">
    <line x1="364" y1="474" x2="1046" y2="474" stroke="#2f3a45" stroke-width="1.6" marker-end="url(#m-llena)"/>
    <text x="390" y="466">6. validate_coupon(código, subtotal)</text>
    <rect x="1046" y="466" width="12" height="52" fill="#d6e6dc" stroke="#2c7a54" stroke-width="1.2"/>
    <line x1="1046" y1="510" x2="370" y2="510" stroke="#5b6875" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#m-abierta)"/>
    <text x="390" y="502" fill="#5b6875">7. Descuento ya calculado — el listado de cupones nunca sale</text>
  </g>

  <!-- ═══════ REGISTRO DEL PEDIDO ═══════ -->
  <g font-size="13" fill="#2f3a45">
    <line x1="364" y1="592" x2="1046" y2="592" stroke="#2f3a45" stroke-width="1.6" marker-end="url(#m-llena)"/>
    <text x="390" y="584">8. place_order(líneas, cliente, destino, cupón)</text>
    <rect x="1046" y="584" width="12" height="248" fill="#d6e6dc" stroke="#2c7a54" stroke-width="1.2"/>
  </g>

  <!-- autollamadas dentro de la transacción -->
  <g stroke="#2c7a54" stroke-width="1.5" fill="none">
    <path d="M1058 624 h44 v26 h-44" marker-end="url(#m-llena)"/>
    <path d="M1058 674 h44 v26 h-44" marker-end="url(#m-llena)"/>
    <path d="M1058 724 h44 v26 h-44" marker-end="url(#m-llena)"/>
  </g>
  <g font-size="12.5" fill="#1f4a35">
    <text x="1116" y="640">Relee el precio vigente de cada pieza</text>
    <text x="1116" y="690">Bloquea las filas y comprueba existencias</text>
    <text x="1116" y="740">Descuenta unidades y graba pedido y líneas</text>
  </g>
  <text x="1116" y="770" font-size="12" fill="#4a6b5b">Todo dentro de la misma transacción: o entra</text>
  <text x="1116" y="786" font-size="12" fill="#4a6b5b">completo, o no entra nada.</text>

  <!-- ═══════ FRAGMENTO ALTERNATIVO ═══════ -->
  <rect x="300" y="812" width="880" height="176" rx="4" fill="none" stroke="#5b6875" stroke-width="1.6"/>
  <path d="M300 812 h74 v24 l-14 14 H300 z" fill="#eef1f4" stroke="#5b6875" stroke-width="1.6"/>
  <text x="316" y="830" font-size="12.5" font-weight="700" fill="#2f3a45">alt</text>
  <text x="390" y="830" font-size="12.5" fill="#2f3a45">[hay unidades suficientes]</text>

  <g font-size="13">
    <line x1="1046" y1="866" x2="370" y2="866" stroke="#5b6875" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#m-abierta)"/>
    <text x="390" y="858" fill="#5b6875">9. Número de pedido asignado (SI-1000, SI-1001…)</text>
  </g>

  <line x1="300" y1="898" x2="1180" y2="898" stroke="#5b6875" stroke-width="1.4" stroke-dasharray="9 6"/>
  <text x="316" y="920" font-size="12.5" fill="#2f3a45">[las existencias no alcanzan]</text>

  <g font-size="13">
    <line x1="1046" y1="956" x2="370" y2="956" stroke="#b5762f" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#m-abierta)"/>
    <text x="390" y="948" fill="#7a4d12">10. Se revierte por completo y se avisa qué pieza faltó</text>
  </g>

  <!-- ═══════ MENSAJE Y CIERRE ═══════ -->
  <g font-size="13" fill="#2f3a45">
    <line x1="364" y1="1030" x2="808" y2="1030" stroke="#2f3a45" stroke-width="1.6" marker-end="url(#m-llena)"/>
    <text x="390" y="1022">11. Solicita el texto del pedido</text>
    <rect x="808" y="1022" width="12" height="60" fill="#e4e8ec" stroke="#12181f" stroke-width="1.2"/>
    <line x1="808" y1="1066" x2="370" y2="1066" stroke="#5b6875" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#m-abierta)"/>
    <text x="390" y="1058" fill="#5b6875">12. Mensaje redactado, con los importes ya grabados</text>

    <line x1="352" y1="1118" x2="136" y2="1118" stroke="#5b6875" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#m-abierta)"/>
    <text x="150" y="1110" fill="#5b6875">13. Enlace listo para abrir la conversación</text>

    <line x1="130" y1="1170" x2="1284" y2="1170" stroke="#2c7a54" stroke-width="1.8" marker-end="url(#m-llena)"/>
    <text x="150" y="1162" fill="#1f4a35">14. El propio cliente abre WhatsApp y envía el mensaje</text>
    <rect x="1284" y="1162" width="12" height="48" fill="#d6e6dc" stroke="#2c7a54" stroke-width="1.2"/>
  </g>

  <text x="150" y="1204" font-size="12.5" fill="#7a8794">El sistema no envía nada en nombre del cliente: solo prepara el texto y el enlace.</text>

  <!-- nota sobre la trazabilidad -->
  <rect x="40" y="1256" width="700" height="112" rx="6" fill="#f7f9fb" stroke="#c8d2dc" stroke-width="1.4"/>
  <text x="62" y="1284" font-size="13" font-weight="700" fill="#12181f">POR QUÉ SE GRABA ANTES DE CONVERSAR</text>
  <text x="62" y="1308" font-size="12.5" fill="#40546b">El pedido queda registrado en el paso 8, antes de abrir WhatsApp. Así hay</text>
  <text x="62" y="1328" font-size="12.5" fill="#40546b">constancia aunque el cliente nunca llegue a escribir, que es justamente lo que</text>
  <text x="62" y="1348" font-size="12.5" fill="#40546b">el comercio no podía rastrear cuando atendía solo por mensajería.</text>

  <!-- leyenda -->
  <rect x="780" y="1256" width="740" height="112" rx="8" fill="#f7f9fb" stroke="#c8d2dc" stroke-width="1.4"/>
  <text x="802" y="1284" font-size="13" font-weight="700" fill="#12181f" letter-spacing="1.2">REFERENCIAS</text>
  <g font-size="12.5" fill="#40546b">
    <text x="802" y="1308">Punta llena · llamada    ·    Punta abierta y trazo cortado · respuesta</text>
    <text x="802" y="1328">Barra vertical · el participante está activo    ·    Marco «alt» · caminos excluyentes</text>
    <text x="802" y="1348" fill="#7a8794">Esta secuencia cubre los requisitos RF06, RF08, RF09, RF10 y RF11.</text>
  </g>
</svg>
