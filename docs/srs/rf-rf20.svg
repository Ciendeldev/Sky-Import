<svg xmlns="http://www.w3.org/2000/svg" width="760" height="803" viewBox="0 0 760 803" font-family="Arial, sans-serif">
  <title>RF20 — Baja de pedidos con restitución de existencias</title><desc>Quién da de baja un pedido y por qué las unidades tienen que volver al inventario.</desc>
  <rect width="760" height="803" fill="#ffffff"/>
  <defs><marker id="f-llena" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#263847"/></marker><marker id="f-abierta" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#455c6e" stroke-width="1.2"/></marker></defs>
  <rect x="18" y="10" width="74" height="30" rx="5" fill="#14212e"/>
  <text x="55" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff"><tspan x="55" dy="0">RF20</tspan></text>
  <text x="106" y="31" text-anchor="start" font-size="22" font-weight="700" fill="#14212e"><tspan x="106" dy="0">Baja de pedidos con restitución de existencias</tspan></text>
  <rect x="18" y="49" width="724" height="178" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="73" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">CASO DE USO · ACTOR Y FUNCIÓN</tspan></text><rect x="249" y="83" width="479" height="134" rx="4" fill="#ffffff" stroke="#bac8d3"/><text x="259" y="102" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="259" dy="0">Sky Import</tspan></text><line x1="148" y1="133" x2="265" y2="129" stroke="#455c6e" stroke-width="1.4"/><g stroke="#34734f" stroke-width="2" fill="none"><circle cx="122" cy="108" r="10" fill="#edf6ef"/><path d="M122 118 v30 m-23,-18 h46 m-23,18 l-18,23 m18,-23 l18,23"/></g><text x="122" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#27543c"><tspan x="122" dy="0">Moderador</tspan></text><text x="122" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#455c6e"><tspan x="122" dy="0">titular · usuario «Cielo»</tspan></text><ellipse cx="488.5" cy="129" rx="223.5" ry="19" fill="#edf6ef" stroke="#34734f" stroke-width="1.5"/><text x="488.5" y="134" text-anchor="middle" font-size="16" font-weight="400" fill="#27543c"><tspan x="488.5" dy="0">Dar de baja un pedido</tspan></text><rect x="18" y="239" width="724" height="396" rx="6" fill="#ffffff" stroke="#bac8d3"/><text x="32" y="263" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">SECUENCIA · COMPORTAMIENTO DEL SISTEMA</tspan></text><rect x="24" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="97" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="97" dy="0">Moderador</tspan></text><line x1="97" y1="322" x2="97" y2="623" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="212.66666666666663" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="285.66666666666663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="285.66666666666663" dy="0">Panel de pedidos</tspan></text><line x1="285.66666666666663" y1="322" x2="285.66666666666663" y2="623" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="401.3333333333333" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="474.3333333333333" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="474.3333333333333" dy="0">delete_order</tspan></text><line x1="474.3333333333333" y1="322" x2="474.3333333333333" y2="623" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="590" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="663" dy="0">products</tspan></text><line x1="663" y1="322" x2="663" y2="623" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="57.77333333333337" y="328" width="267.1199999999999" height="19" rx="2" fill="#ffffff"/><text x="191.33333333333331" y="342" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="191.33333333333331" dy="0">1. transcribe el número del pedido</tspan></text><line x1="97" y1="355" x2="285.66666666666663" y2="355" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="282.6" y="368" width="194.7999999999999" height="19" rx="2" fill="#ffffff"/><text x="380" y="382" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="380" dy="0">2. delete_order(pedido)</tspan></text><line x1="285.66666666666663" y1="395" x2="474.3333333333333" y2="395" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="373.8133333333334" y="408" width="201.0399999999999" height="19" rx="2" fill="#ffffff"/><text x="474.3333333333333" y="422" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="474.3333333333333" dy="0">3. exige rol de moderador</tspan></text><path d="M474.3333333333333 435 h-30 v12 h30" fill="none" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="366.37333333333333" y="452" width="215.9199999999999" height="19" rx="2" fill="#ffffff"/><text x="474.3333333333333" y="466" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="474.3333333333333" dy="0">4. bloquea la fila del pedido</tspan></text><path d="M474.3333333333333 479 h-30 v12 h30" fill="none" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="352.96000000000026" y="496" width="369.03999999999974" height="19" rx="2" fill="#ffffff"/><text x="537.4800000000001" y="510" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="537.4800000000001" dy="0">5. devuelve las unidades, salvo si ya se entregó</tspan></text><line x1="474.3333333333333" y1="523" x2="663" y2="523" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="296.45333333333343" y="536" width="355.75999999999976" height="19" rx="2" fill="#ffffff"/><text x="474.3333333333333" y="550" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="474.3333333333333" dy="0">6. borra el pedido; las líneas caen en cascada</tspan></text><path d="M474.3333333333333 563 h-30 v12 h30" fill="none" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="225.16000000000008" y="580" width="309.67999999999984" height="19" rx="2" fill="#ffffff"/><text x="380" y="594" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="380" dy="0">7. número borrado y unidades devueltas</tspan></text><line x1="474.3333333333333" y1="607" x2="285.66666666666663" y2="607" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="18" y="647" width="724" height="94" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="671" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">COMPONENTES QUE INTERVIENEN</tspan></text><rect x="38" y="683" width="334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="691" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="709" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="205" y="711" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="205" dy="0">Funciones transaccionales</tspan></text><rect x="388" y="683" width="334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="383" y="691" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="383" y="709" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="555" y="711" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="555" dy="0">Control de existencias</tspan></text>
  <text x="20" y="767" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="20" dy="0">Devolver el stock y borrar la fila ocurren en la misma transacción. En dos pasos, un fallo del segundo</tspan><tspan x="20" dy="18">dejaría las unidades devueltas y el pedido en pie, y reintentarlo las devolvería otra vez.</tspan></text>
  </svg>
