      <text x="1076" y="656" text-anchor="middle" font-size="12.5" fill="#2f3a45">Control de existencias</text>

  <text x="30" y="726" font-size="12" fill="#7a8794">Devolver el stock y borrar la fila ocurren en la misma transacción. En dos pasos, un fallo del segundo dejaría las unidades devueltas y el pedido en pie, y reintentarlo las devolvería otra vez.</text>
