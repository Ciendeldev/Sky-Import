  <text x="30" y="672" font-size="12" fill="#7a8794">El rango no es un capricho: acá el guaraní se escribe «7.400» con punto de millar, y un campo numérico se lo come y guarda 7. Ese error dividió por mil todos los precios publicados una vez.</text>
