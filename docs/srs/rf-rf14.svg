<svg xmlns="http://www.w3.org/2000/svg" width="760" height="759" viewBox="0 0 760 759" font-family="Arial, sans-serif">
  <title>RF14 — Configuración de precios y tasa de cambio</title><desc>Quién fija la tasa y qué impide que un error de tecleo reviente todos los precios.</desc>
  <rect width="760" height="759" fill="#ffffff"/>
  <defs><marker id="f-llena" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#263847"/></marker><marker id="f-abierta" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#455c6e" stroke-width="1.2"/></marker></defs>
  <rect x="18" y="10" width="74" height="30" rx="5" fill="#14212e"/>
  <text x="55" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff"><tspan x="55" dy="0">RF14</tspan></text>
  <text x="106" y="31" text-anchor="start" font-size="22" font-weight="700" fill="#14212e"><tspan x="106" dy="0">Configuración de precios y tasa de cambio</tspan></text>
  <rect x="18" y="49" width="724" height="178" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="73" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">CASO DE USO · ACTOR Y FUNCIÓN</tspan></text><rect x="249" y="83" width="479" height="134" rx="4" fill="#ffffff" stroke="#bac8d3"/><text x="259" y="102" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="259" dy="0">Sky Import</tspan></text><line x1="148" y1="133" x2="265" y2="129" stroke="#455c6e" stroke-width="1.4"/><line x1="148" y1="133" x2="265" y2="174" stroke="#455c6e" stroke-width="1.4"/><g stroke="#956124" stroke-width="2" fill="none"><circle cx="122" cy="108" r="10" fill="#faf1e6"/><path d="M122 118 v30 m-23,-18 h46 m-23,18 l-18,23 m18,-23 l18,23"/></g><text x="122" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#704716"><tspan x="122" dy="0">Administrador</tspan></text><text x="122" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#455c6e"><tspan x="122" dy="0">y también el moderador</tspan></text><ellipse cx="488.5" cy="129" rx="223.5" ry="19" fill="#faf1e6" stroke="#956124" stroke-width="1.5"/><text x="488.5" y="134" text-anchor="middle" font-size="16" font-weight="400" fill="#704716"><tspan x="488.5" dy="0">Fijar la tasa de cambio</tspan></text><ellipse cx="488.5" cy="174" rx="223.5" ry="19" fill="#faf1e6" stroke="#956124" stroke-width="1.5"/><text x="488.5" y="179" text-anchor="middle" font-size="16" font-weight="400" fill="#704716"><tspan x="488.5" dy="0">Fijar el umbral de aviso</tspan></text><rect x="18" y="239" width="724" height="352" rx="6" fill="#ffffff" stroke="#bac8d3"/><text x="32" y="263" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">SECUENCIA · COMPORTAMIENTO DEL SISTEMA</tspan></text><rect x="24" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="97" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="97" dy="0">Administrador</tspan></text><line x1="97" y1="322" x2="97" y2="579" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="212.66666666666663" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="285.66666666666663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="285.66666666666663" dy="0">Panel de precios</tspan></text><line x1="285.66666666666663" y1="322" x2="285.66666666666663" y2="579" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="401.3333333333333" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="474.3333333333333" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="474.3333333333333" dy="0">Servidor</tspan></text><line x1="474.3333333333333" y1="322" x2="474.3333333333333" y2="579" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="590" y="278" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="663" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="663" dy="0">settings</tspan></text><line x1="663" y1="322" x2="663" y2="579" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="55.77333333333337" y="328" width="271.1199999999999" height="19" rx="2" fill="#ffffff"/><text x="191.33333333333331" y="342" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="191.33333333333331" dy="0">1. escribe los guaraníes por dólar</tspan></text><line x1="97" y1="355" x2="285.66666666666663" y2="355" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="67.62666666666689" y="368" width="436.0799999999995" height="19" rx="2" fill="#ffffff"/><text x="285.66666666666663" y="382" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="285.66666666666663" dy="0">2. avisa en rojo mientras escribe si el valor es imposible</tspan></text><path d="M285.66666666666663 395 h30 v12 h-30" fill="none" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="329.56" y="412" width="100.88000000000001" height="19" rx="2" fill="#ffffff"/><text x="380" y="426" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="380" dy="0">3. saveFx()</tspan></text><line x1="285.66666666666663" y1="439" x2="474.3333333333333" y2="439" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="252.85333333333347" y="452" width="442.9599999999997" height="19" rx="2" fill="#ffffff"/><text x="474.3333333333333" y="466" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="474.3333333333333" dy="0">4. exige entre 1000 y 20000 guaraníes, y 1 a 50 reales</tspan></text><path d="M474.3333333333333 479 h-30 v12 h30" fill="none" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="426.14666666666665" y="496" width="285.0399999999999" height="19" rx="2" fill="#ffffff"/><text x="568.6666666666666" y="510" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="568.6666666666666" dy="0">5. graba la tasa y su marca temporal</tspan></text><line x1="474.3333333333333" y1="523" x2="663" y2="523" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="173.72000000000017" y="536" width="412.55999999999966" height="19" rx="2" fill="#ffffff"/><text x="380" y="550" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="380" dy="0">6. propagado a toda la tienda, sin desplegar de nuevo</tspan></text><line x1="474.3333333333333" y1="563" x2="285.66666666666663" y2="563" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="18" y="603" width="724" height="94" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="627" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">COMPONENTES QUE INTERVIENEN</tspan></text><rect x="38" y="639" width="334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="647" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="665" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="205" y="667" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="205" dy="0">Configuración comercial</tspan></text><rect x="388" y="639" width="334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="383" y="647" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="383" y="665" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="555" y="667" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="555" dy="0">Conversión de moneda</tspan></text>
  <text x="20" y="723" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="20" dy="0">El servidor valida los rangos de las tasas. La presentación en moneda local cambia con la</tspan><tspan x="20" dy="18">configuración; los pedidos ya registrados conservan su tasa histórica.</tspan></text>
  </svg>
