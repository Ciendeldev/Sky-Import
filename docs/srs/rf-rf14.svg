  <line x1="584" y1="226" x2="837" y2="226" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="715" y="218" text-anchor="middle" font-size="12" fill="#2f3a45">1. escribe los guaraníes por dólar</text><path d="M846 260 h38 v22 h-38" fill="none" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="892" y="262" text-anchor="start" font-size="12" fill="#2f3a45">2. avisa en rojo mientras escribe si el valor es imposible</text><line x1="846" y1="324" x2="1099" y2="324" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="977" y="316" text-anchor="middle" font-size="12" fill="#2f3a45">3. saveFx()</text><path d="M1108 358 h38 v22 h-38" fill="none" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="1154" y="360" text-anchor="start" font-size="12" fill="#2f3a45">4. exige entre 1000 y 20000 guaraníes, y 1 a 50 reales</text><line x1="1108" y1="422" x2="1361" y2="422" stroke="#2f3a45" stroke-width="1.5" marker-end="url(#f-llena)"/><text x="1239" y="414" text-anchor="middle" font-size="12" fill="#2f3a45">5. graba la tasa y su marca temporal</text><line x1="1108" y1="466" x2="855" y2="466" stroke="#5b6875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#f-abierta)"/><text x="977" y="458" text-anchor="middle" font-size="12" fill="#5b6875">6. propagado a toda la tienda, sin desplegar de nuevo</text>
  
