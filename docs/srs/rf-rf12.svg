<svg xmlns="http://www.w3.org/2000/svg" width="760" height="831" viewBox="0 0 760 831" font-family="Arial, sans-serif">
  <title>RF12 — Administración de productos y variantes</title><desc>Quién mantiene el catálogo y qué comprueba la base antes de aceptar la escritura.</desc>
  <rect width="760" height="831" fill="#ffffff"/>
  <defs><marker id="f-llena" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#263847"/></marker><marker id="f-abierta" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#455c6e" stroke-width="1.2"/></marker></defs>
  <rect x="18" y="10" width="74" height="30" rx="5" fill="#14212e"/>
  <text x="55" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff"><tspan x="55" dy="0">RF12</tspan></text>
  <text x="106" y="31" text-anchor="start" font-size="22" font-weight="700" fill="#14212e"><tspan x="106" dy="0">Administración de productos y variantes</tspan></text>
  <rect x="18" y="49" width="724" height="254" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="73" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">CASO DE USO · ACTOR Y FUNCIÓN</tspan></text><rect x="249" y="83" width="479" height="210" rx="4" fill="#ffffff" stroke="#bac8d3"/><text x="259" y="102" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="259" dy="0">Sky Import</tspan></text><line x1="148" y1="133" x2="265" y2="129" stroke="#455c6e" stroke-width="1.4"/><line x1="148" y1="133" x2="265" y2="174" stroke="#455c6e" stroke-width="1.4"/><line x1="148" y1="133" x2="265" y2="219" stroke="#455c6e" stroke-width="1.4"/><line x1="148" y1="133" x2="265" y2="264" stroke="#455c6e" stroke-width="1.4"/><g stroke="#956124" stroke-width="2" fill="none"><circle cx="122" cy="108" r="10" fill="#faf1e6"/><path d="M122 118 v30 m-23,-18 h46 m-23,18 l-18,23 m18,-23 l18,23"/></g><text x="122" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#704716"><tspan x="122" dy="0">Administrador</tspan></text><text x="122" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#455c6e"><tspan x="122" dy="0">y también el moderador</tspan></text><ellipse cx="488.5" cy="129" rx="223.5" ry="19" fill="#faf1e6" stroke="#956124" stroke-width="1.5"/><text x="488.5" y="134" text-anchor="middle" font-size="16" font-weight="400" fill="#704716"><tspan x="488.5" dy="0">Dar de alta una pieza</tspan></text><ellipse cx="488.5" cy="174" rx="223.5" ry="19" fill="#faf1e6" stroke="#956124" stroke-width="1.5"/><text x="488.5" y="179" text-anchor="middle" font-size="16" font-weight="400" fill="#704716"><tspan x="488.5" dy="0">Editarla</tspan></text><ellipse cx="488.5" cy="219" rx="223.5" ry="19" fill="#faf1e6" stroke="#956124" stroke-width="1.5"/><text x="488.5" y="224" text-anchor="middle" font-size="16" font-weight="400" fill="#704716"><tspan x="488.5" dy="0">Darla de baja</tspan></text><ellipse cx="488.5" cy="264" rx="223.5" ry="19" fill="#faf1e6" stroke="#956124" stroke-width="1.5"/><text x="488.5" y="269" text-anchor="middle" font-size="16" font-weight="400" fill="#704716"><tspan x="488.5" dy="0">Administrar sus variantes</tspan></text><rect x="18" y="315" width="724" height="348" rx="6" fill="#ffffff" stroke="#bac8d3"/><text x="32" y="339" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">SECUENCIA · COMPORTAMIENTO DEL SISTEMA</tspan></text><rect x="24" y="354" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="97" y="381" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="97" dy="0">Administrador</tspan></text><line x1="97" y1="398" x2="97" y2="651" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="212.66666666666663" y="354" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="285.66666666666663" y="381" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="285.66666666666663" dy="0">Panel</tspan></text><line x1="285.66666666666663" y1="398" x2="285.66666666666663" y2="651" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="401.3333333333333" y="354" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="474.3333333333333" y="381" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="474.3333333333333" dy="0">Servidor</tspan></text><line x1="474.3333333333333" y1="398" x2="474.3333333333333" y2="651" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="590" y="354" width="146" height="44" rx="4" fill="#f5f8fa" stroke="#455c6e"/><text x="663" y="381" text-anchor="middle" font-size="15" font-weight="700" fill="#263847"><tspan x="663" dy="0">Catálogo SQL</tspan></text><line x1="663" y1="398" x2="663" y2="651" stroke="#a8bbc9" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="70.25333333333333" y="404" width="242.15999999999997" height="19" rx="2" fill="#ffffff"/><text x="191.33333333333331" y="418" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="191.33333333333331" dy="0">1. completa la ficha de la pieza</tspan></text><line x1="97" y1="431" x2="285.66666666666663" y2="431" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="243.64000000000004" y="444" width="272.7199999999999" height="19" rx="2" fill="#ffffff"/><text x="380" y="458" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="380" dy="0">2. saveProduct() o saveVariant()</tspan></text><line x1="285.66666666666663" y1="471" x2="474.3333333333333" y2="471" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="309.89333333333343" y="484" width="328.8799999999998" height="19" rx="2" fill="#ffffff"/><text x="474.3333333333333" y="498" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="474.3333333333333" dy="0">3. comprueba la sesión y el acceso vigente</tspan></text><path d="M474.3333333333333 511 h-30 v12 h30" fill="none" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="316.8000000000004" y="528" width="405.19999999999965" height="19" rx="2" fill="#ffffff"/><text x="519.4000000000002" y="542" text-anchor="middle" font-size="16" font-weight="400" fill="#263847"><tspan x="519.4000000000002" dy="0">4. inserta o actualiza, sujeto a las políticas de fila</tspan></text><line x1="474.3333333333333" y1="555" x2="663" y2="555" stroke="#263847" stroke-width="1.6" marker-end="url(#f-llena)"/><rect x="507.66666666666663" y="568" width="122.00000000000001" height="19" rx="2" fill="#ffffff"/><text x="568.6666666666666" y="582" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="568.6666666666666" dy="0">5. fila grabada</tspan></text><line x1="663" y1="595" x2="474.3333333333333" y2="595" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="200.60000000000016" y="608" width="358.79999999999967" height="19" rx="2" fill="#ffffff"/><text x="380" y="622" text-anchor="middle" font-size="16" font-weight="400" fill="#455c6e"><tspan x="380" dy="0">6. confirmación y páginas públicas revalidadas</tspan></text><line x1="474.3333333333333" y1="635" x2="285.66666666666663" y2="635" stroke="#455c6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-abierta)"/><rect x="18" y="675" width="724" height="94" rx="6" fill="#f5f8fa" stroke="#bac8d3"/><text x="32" y="699" text-anchor="start" font-size="16" font-weight="700" fill="#14212e"><tspan x="32" dy="0">COMPONENTES QUE INTERVIENEN</tspan></text><rect x="38" y="711" width="334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="719" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="33" y="737" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="205" y="739" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="205" dy="0">Acciones de servidor</tspan></text><rect x="388" y="711" width="334" height="46" rx="4" fill="#ffffff" stroke="#455c6e"/><rect x="383" y="719" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><rect x="383" y="737" width="10" height="8" fill="#ffffff" stroke="#455c6e"/><text x="555" y="739" text-anchor="middle" font-size="15" font-weight="400" fill="#263847"><tspan x="555" dy="0">Políticas de seguridad por fila</tspan></text>
  <text x="20" y="795" text-anchor="start" font-size="15" font-weight="400" fill="#455c6e"><tspan x="20" dy="0">El catálogo utiliza products y product_variants. Las acciones comprueban el acceso vigente; las</tspan><tspan x="20" dy="18">políticas por fila restringen las escrituras en la base a las cuentas autorizadas.</tspan></text>
  </svg>
